// ===== js/run.js ===== //
// run.js — воқеан иҷрокунандаи HTML+CSS+JS-и лоиҳа дар iframe-и sandbox-шуда.
// Ҳеҷ гуна маълумоти ҳассос (API Key ва ғ.) ба iframe дода намешавад.
'use strict';

const Run = {
  iframe: null,

  mount(container) {
    container.innerHTML = `<iframe id="run-frame" class="run-frame"
      sandbox="allow-scripts allow-forms allow-popups allow-modals"
      referrerpolicy="no-referrer"></iframe>`;
    this.iframe = container.querySelector('#run-frame');
    window.addEventListener('message', (e) => this._onMessage(e));
  },

  async execute(projectId) {
    if (!this.iframe) throw new Error('Экрани RUN омода нест.');
    Console.clear();
    Console.log('info', '▶ Омодасозии лоиҳа барои иҷро...');

    const nodes = await Files.allInProject(projectId);
    const byPath = {};
    const buildPath = async (n) => (n.parentId ? (await buildPath(await Files.get(n.parentId))) + '/' + n.name : n.name);
    for (const n of nodes.filter((x) => x.type === 'file')) {
      byPath[await buildPath(n)] = n;
    }

    const entry = byPath['index.html'] || Object.values(byPath).find((n) => n.name === 'index.html');
    if (!entry) {
      Console.log('error', 'Файли index.html дар лоиҳа ёфт нашуд. RUN имконнопазир аст.');
      Notify.error('index.html ёфт нашуд.');
      return;
    }

    let html = entry.content || '';

    // Тзвиҷи ин файлҳои <link>/<script src> — танҳо агар воқеан дар лоиҳа ёфт шаванд
    html = html.replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
      const file = byPath[href] || byPath[href.replace(/^\.\//, '')];
      if (file && Utils.fileExtension(file.name) === 'css') {
        return `<style data-src="${Utils.escapeHtml(href)}">${file.content || ''}</style>`;
      }
      return match;
    });

    html = html.replace(/<script[^>]+src=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
      const file = byPath[src] || byPath[src.replace(/^\.\//, '')];
      if (file && Utils.fileExtension(file.name) === 'js') {
        return `<script data-src="${Utils.escapeHtml(src)}">${file.content || ''}</` + `script>`;
      }
      return match;
    });

    const bridge = `
<script>
(function(){
  function send(type, args){
    try { parent.postMessage({ __zh_console: true, type: type, args: args.map(function(a){
      try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e){ return String(a); }
    }) }, '*'); } catch(e) {}
  }
  ['log','warn','error','info'].forEach(function(m){
    var orig = console[m];
    console[m] = function(){ send(m, Array.prototype.slice.call(arguments)); orig && orig.apply(console, arguments); };
  });
  window.onerror = function(msg, src, line, col){
    send('error', [msg + ' (сатр ' + line + ', сутун ' + col + ')']);
  };
  window.addEventListener('unhandledrejection', function(e){
    send('error', ['Promise рад шуд: ' + (e.reason && e.reason.message || e.reason)]);
  });
})();
<\/script>`;

    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head[^>]*>/i, (m) => m + bridge);
    } else {
      html = bridge + html;
    }

    this.iframe.srcdoc = html;
    Console.log('info', '✔ Лоиҳа дар экрани алоҳида иҷро шуд.');
  },

  _onMessage(e) {
    const data = e.data;
    if (!data || !data.__zh_console) return;
    Console.log(data.type, data.args.join(' '));
  },

  stop() {
    if (this.iframe) this.iframe.srcdoc = 'about:blank';
    Console.log('info', '⏹ Иҷро қатъ шуд.');
  }
};

window.Run = Run;

// ===== js/ai.js ===== //
// ai.js — фиристодани дархости воқеӣ ба хизматрасонии Зеҳни сунъии интихобшуда.
// Дархост мустақиман аз браузери корбар меравад; калид ба сервери ZEROHUBUIAL намеравад.
'use strict';

const AI = {
  // Фиристодани як дархости оддӣ ба хизматрасонии мушаххас
  async send(keyConfig, messages, opts = {}) {
    const { service, apiKey, model, baseUrl } = keyConfig;
    if (!apiKey) throw new Error('API Key холӣ аст.');

    if (service === 'anthropic') return this._sendAnthropic(apiKey, model, messages, baseUrl, opts);
    if (service === 'openai') return this._sendOpenAI(apiKey, model, messages, baseUrl, opts);
    if (service === 'groq') return this._sendOpenAI(apiKey, model, messages, baseUrl || 'https://api.groq.com/openai', opts); // Groq форматаи OpenAI-ро истифода мебарад
    if (service === 'gemini') return this._sendGemini(apiKey, model, messages, baseUrl, opts);
    if (service === 'custom') return this._sendOpenAI(apiKey, model, messages, baseUrl, opts); // формати OpenAI-мувофиқ фарз мешавад
    throw new Error(`Хизматрасонии номаълум: ${service}`);
  },

  async _sendAnthropic(apiKey, model, messages, baseUrl, opts) {
    const url = (baseUrl || 'https://api.anthropic.com') + '/v1/messages';
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model || 'claude-sonnet-4-6',
        max_tokens: opts.maxTokens || 1024,
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
      })
    });
    const data = await this._parseJsonSafe(res);
    if (!res.ok) throw this._toError(res, data);
    const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
    return { text, raw: data };
  },

  async _sendOpenAI(apiKey, model, messages, baseUrl, opts) {
    const url = (baseUrl || 'https://api.openai.com') + '/v1/chat/completions';
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model || 'gpt-4o-mini',
        max_tokens: opts.maxTokens || 1024,
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
      })
    });
    const data = await this._parseJsonSafe(res);
    if (!res.ok) throw this._toError(res, data);
    const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    return { text, raw: data };
  },

  async _sendGemini(apiKey, model, messages, baseUrl, opts) {
    const base = (baseUrl || 'https://generativelanguage.googleapis.com') + '/v1beta';
    const mdl = model || 'gemini-2.5-flash';
    const url = `${base}/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: messages.map((m) => ({
          role: m.role === 'assistant' ? 'model' : 'user',
          parts: [{ text: m.content }]
        })),
        generationConfig: { maxOutputTokens: opts.maxTokens || 1024 }
      })
    });
    const data = await this._parseJsonSafe(res);
    if (!res.ok) throw this._toError(res, data);
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts ? cand.content.parts.map((p) => p.text || '').join('') : '';
    if (!text && cand && cand.finishReason) {
      throw new Error(`Gemini ҷавоб надод (сабаб: ${cand.finishReason}).`);
    }
    return { text, raw: data };
  },

  async _parseJsonSafe(res) {
    try { return await res.json(); } catch { return null; }
  },

  _toError(res, data) {
    const msg = (data && (data.error?.message || data.message)) || `Хатои сервер (HTTP ${res.status})`;
    const err = new Error(msg);
    err.status = res.status;
    err.isQuota = res.status === 429 || /quota|rate.?limit|insufficient/i.test(msg);
    return err;
  },

  // Фиристодан бо системаи навбатии калидҳо: агар хатои квота бошад, ба калиди
  // навбатӣ мегузарад ва контексти чат гум намешавад (ҳамон messages истифода мешаванд).
  async sendWithRotation(messages, opts = {}) {
    const tried = [];
    let lastErr = null;
    // то 5 маротиба кӯшиш — то шумораи калидҳои фаъол
    for (let i = 0; i < 5; i++) {
      const key = await AIKeys.nextAvailable(tried);
      if (!key) break;
      try {
        const result = await this.send(key, messages, opts);
        return { ...result, usedKey: key };
      } catch (e) {
        lastErr = e;
        tried.push(key.id);
        if (e.isQuota) {
          await AIKeys.markQuotaBlocked(key.id);
          continue; // ба калиди навбатӣ мегузарем
        }
        // хатои оддӣ — ба калиди дигар нагузар (тибқи талабот)
        throw e;
      }
    }
    throw lastErr || new Error('Ягон калиди фаъоли Зеҳни сунъӣ мавҷуд нест. Дар бахши "КАЛИДҲОИ ЗЕҲНИ СУНЪӢ" калид илова кунед.');
  }
};

window.AI = AI;

// ===== js/ai-keys.js ===== //
// ai-keys.js — идоракунии калидҳои хизматрасониҳои Зеҳни сунъӣ.
// API Key-и хом ҳАРГИЗ ба сервери ZEROHUBUIAL фиристода намешавад — танҳо дар
// дастгоҳи худи корбар (IndexedDB) нигоҳ дошта мешавад ва мустақиман аз браузер
// ба хизматрасонии интихобшуда фиристода мешавад.
'use strict';

const AIKeys = {
  async list() {
    const items = await DB.getAll(DB.STORES.AI_KEYS);
    return items.sort((a, b) => (a.order || 0) - (b.order || 0));
  },

  async get(id) {
    return DB.get(DB.STORES.AI_KEYS, id);
  },

  async add({ name, service, apiKey, model, baseUrl }) {
    const all = await this.list();
    const item = {
      id: Utils.uid('key'),
      name: name || `Калиди ${all.length + 1}`,
      service: service || 'anthropic', // 'anthropic' | 'openai' | 'custom'
      apiKey,
      model: model || '',
      baseUrl: baseUrl || '',
      active: true,
      order: all.length,
      quotaBlockedUntil: 0,
      createdAt: Date.now()
    };
    await DB.put(DB.STORES.AI_KEYS, item);
    return item;
  },

  async update(id, patch) {
    const item = await this.get(id);
    if (!item) throw new Error('Калид ёфт нашуд.');
    Object.assign(item, patch);
    await DB.put(DB.STORES.AI_KEYS, item);
    return item;
  },

  async remove(id) {
    await DB.delete(DB.STORES.AI_KEYS, id);
  },

  async toggleActive(id) {
    const item = await this.get(id);
    if (!item) return;
    item.active = !item.active;
    await DB.put(DB.STORES.AI_KEYS, item);
    return item;
  },

  // Калиди навбатии фаъол ва бе манъи квота
  async nextAvailable(excludeIds = []) {
    const all = await this.list();
    const now = Date.now();
    return all.find((k) => k.active && !excludeIds.includes(k.id) && (!k.quotaBlockedUntil || k.quotaBlockedUntil < now)) || null;
  },

  async markQuotaBlocked(id, minutes = 30) {
    return this.update(id, { quotaBlockedUntil: Date.now() + minutes * 60 * 1000 });
  },

  // Санҷиши пайвастшавии воқеӣ — воқеан ба API дархост мефиристад
  async testConnection(id) {
    const key = await this.get(id);
    if (!key) throw new Error('Калид ёфт нашуд.');
    try {
      await AI.send(key, [{ role: 'user', content: 'ping' }], { maxTokens: 8 });
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }
};

window.AIKeys = AIKeys;

// ===== js/chat.js ===== //
// chat.js — чати воқеии Зеҳни сунъӣ дар дохили лоиҳа, ва AL CHAT (чат-мудири умумӣ).
// Ягон амали тағйирдиҳанда (сохтан/тағйир/несткунии файл) бе тасдиқи корбар иҷро намешавад.
'use strict';

const ACTION_BLOCK_RE = /```zh-action\s*([\s\S]*?)```/g;

const Chat = {
  el: null,
  scope: null,     // projectId барои чати лоиҳа, ё 'AL_CHAT' барои чат-мудири умумӣ
  history: [],

  mount(container) {
    this.el = container;
  },

  async load(scope) {
    this.scope = scope;
    const existing = (await DB.getAllByIndex(DB.STORES.CHATS, 'byScope', scope))[0];
    if (existing) {
      this.history = existing.messages || [];
    } else {
      this.history = [];
      await DB.put(DB.STORES.CHATS, { id: Utils.uid('chat'), scope, messages: [] });
    }
  },

  async _persist() {
    const rec = (await DB.getAllByIndex(DB.STORES.CHATS, 'byScope', this.scope))[0];
    if (rec) {
      rec.messages = this.history;
      await DB.put(DB.STORES.CHATS, rec);
    }
  },

  async clearHistory(scope) {
    const rec = (await DB.getAllByIndex(DB.STORES.CHATS, 'byScope', scope))[0];
    if (rec) {
      rec.messages = [];
      await DB.put(DB.STORES.CHATS, rec);
    }
    if (this.scope === scope) this.history = [];
  },

  async buildProjectContext(projectId) {
    const project = await Projects.get(projectId);
    const nodes = await Files.allInProject(projectId);
    const tree = nodes.map((n) => ({ path: null, type: n.type, name: n.name, id: n.id, parentId: n.parentId }));
    // сохтани роҳҳои пурра
    const pathById = {};
    const buildPath = (id) => {
      if (pathById[id]) return pathById[id];
      const n = nodes.find((x) => x.id === id);
      if (!n) return '';
      const p = n.parentId ? buildPath(n.parentId) + '/' + n.name : n.name;
      pathById[id] = p;
      return p;
    };
    nodes.forEach((n) => buildPath(n.id));
    const files = nodes.filter((n) => n.type === 'file').map((n) => ({
      path: pathById[n.id],
      content: (n.content || '').slice(0, 4000)
    }));
    return { projectName: project ? project.name : '', fileTree: Object.values(pathById), files };
  },

  systemPromptForProject(ctx) {
    return `Ту дастёри Зеҳни сунъӣ дар дохили лоиҳаи "${ctx.projectName}" дар ZEROHUBUIAL ҳастӣ.
Контексти лоиҳа:
Файлҳо: ${ctx.fileTree.join(', ') || '(холӣ)'}

Мазмуни файлҳо (кӯтоҳшуда):
${ctx.files.map((f) => `--- ${f.path} ---\n${f.content}`).join('\n\n')}

Агар корбар хоҳад, ки файл/папка сохта, тағйир дода ё нест карда шавад, дар охири ҷавоби худ як блоки зерин илова кун (ин пешниҳод аст, на иҷрои фаврӣ — корбар бояд тасдиқ кунад):
\`\`\`zh-action
{"action":"create_file|create_folder|edit_file|delete_node|rename_node","path":"pages/about.html","content":"...","newName":"..."}
\`\`\`
Дар матни оддии ҷавоб бо забони тоҷикӣ ҷавоб деҳ.`;
  },

  systemPromptForAlChat() {
    return `Номи ту ZEROHUBUIAL аст, шахсияти намоишии ту "Азиззода Валиҷон" номида мешавад.
Ту чат-мудири умумии барномаи ZEROHUBUIAL ҳастӣ — платформае, ки корбар дар он вебсайти
HTML/CSS/JS месозад ва баъд ба APK-и воқеии Android табдил медиҳад. Бо забони тоҷикӣ ва
муфид ҷавоб деҳ.`;
  },

  async sendProjectMessage(projectId, userText) {
    this.history.push({ role: 'user', content: userText, ts: Date.now() });
    await this._persist();

    const ctx = await this.buildProjectContext(projectId);
    const messages = [
      { role: 'user', content: this.systemPromptForProject(ctx) },
      ...this.history.slice(-12).map((m) => ({ role: m.role, content: m.content }))
    ];

    const result = await AI.sendWithRotation(messages);
    const reply = result.text || '(ҷавоби холӣ)';
    const actions = this._extractActions(reply);
    this.history.push({ role: 'assistant', content: reply, actions, ts: Date.now() });
    await this._persist();
    return { reply, actions };
  },

  async sendAlChatMessage(userText) {
    this.history.push({ role: 'user', content: userText, ts: Date.now() });
    await this._persist();
    const messages = [
      { role: 'user', content: this.systemPromptForAlChat() },
      ...this.history.slice(-12).map((m) => ({ role: m.role, content: m.content }))
    ];
    const result = await AI.sendWithRotation(messages);
    const reply = result.text || '(ҷавоби холӣ)';
    this.history.push({ role: 'assistant', content: reply, ts: Date.now() });
    await this._persist();
    return { reply };
  },

  _extractActions(text) {
    const actions = [];
    let m;
    ACTION_BLOCK_RE.lastIndex = 0;
    while ((m = ACTION_BLOCK_RE.exec(text))) {
      try { actions.push(JSON.parse(m[1].trim())); } catch { /* блоки нодуруст — сарфи назар */ }
    }
    return actions;
  },

  // Иҷрои амал ФАҚАТ пас аз тасдиқи корбар
  async applyAction(projectId, action) {
    const findByPath = async (path) => {
      const nodes = await Files.allInProject(projectId);
      const pathById = {};
      const buildPath = (id) => {
        if (pathById[id]) return pathById[id];
        const n = nodes.find((x) => x.id === id);
        if (!n) return '';
        const p = n.parentId ? buildPath(n.parentId) + '/' + n.name : n.name;
        pathById[id] = p;
        return p;
      };
      nodes.forEach((n) => buildPath(n.id));
      const found = nodes.find((n) => pathById[n.id] === path);
      return found || null;
    };

    const splitPath = (path) => {
      const parts = path.split('/').filter(Boolean);
      const name = parts.pop();
      return { parts, name };
    };

    const ensureFolders = async (parts) => {
      let parentId = null;
      for (const part of parts) {
        const kids = await Files.children(projectId, parentId);
        let found = kids.find((k) => k.type === 'folder' && k.name === part);
        if (!found) found = await Files.createFolder(projectId, parentId, part);
        parentId = found.id;
      }
      return parentId;
    };

    switch (action.action) {
      case 'create_file': {
        const { parts, name } = splitPath(action.path);
        const parentId = await ensureFolders(parts);
        return Files.createFile(projectId, parentId, name, action.content || '');
      }
      case 'create_folder': {
        const { parts, name } = splitPath(action.path);
        const parentId = await ensureFolders(parts);
        return Files.createFolder(projectId, parentId, name);
      }
      case 'edit_file': {
        const node = await findByPath(action.path);
        if (!node) throw new Error(`Файли "${action.path}" ёфт нашуд.`);
        return Files.updateContent(node.id, action.content || '');
      }
      case 'delete_node': {
        const node = await findByPath(action.path);
        if (!node) throw new Error(`"${action.path}" ёфт нашуд.`);
        return Files.delete(node.id);
      }
      case 'rename_node': {
        const node = await findByPath(action.path);
        if (!node) throw new Error(`"${action.path}" ёфт нашуд.`);
        return Files.rename(node.id, action.newName);
      }
      default:
        throw new Error(`Амали номаълум: ${action.action}`);
    }
  }
};

window.Chat = Chat;

// ===== js/build-api.js ===== //
// build-api.js — пайвастшавии ВОҚЕӢ ба муҳаррики берунии H2APK.
//
// МУҲИМ — ХОНДАН ҲАТМӢ:
// Аз рӯи README-и расмии H2APK (https://github.com/HashShin/H2APK) чор endpoint-и
// зерин ВОҚЕАН вуҷуд доранд ва дар ин файл истифода мешаванд:
//   POST /api/build         — оғози сохтмон (JSON body)
//   GET  /api/status/{id}   — ҳолати сохтмон
//   GET  /api/log/{id}      — SSE стрими лог
//   GET  /api/download/{id} — боргирии APK
//
// Он чизе, ки то ҳол ВОҚЕАН тасдиқ карда НАШУДААСТ: номи дақиқи майдонҳои JSON
// дар бадани дархости /api/build (масалан appName ё app_name) ва шакли дақиқи
// ҷавоби /api/status, зеро дидани дарахти пурраи коди сервер (internal/app)
// тавассути браузери GitHub манъ буд ва JS-бандли фронтенди зинда низ дастнорас буд.
//
// Аз ин рӯ: майдонҳои зерин дар "buildFormToPayload()" бар ПОЯИ номҳои воқеии
// майдонҳои формаи зиндаи H2APK (h2apk.hashcode.win) навишта шудаанд, аммо ҳамчун
// "беҳтарин тахмини мустанад" қайд мешаванд — на ҳамчун далели 100% тасдиқшуда.
// Агар сервер хатои валидатсия баргардонад, он хатои ВОҚЕӢ бетағйир ба корбар
// нишон дода мешавад (на пинҳон карда мешавад ва на бо мушовараи қалбакӣ иваз
// мешавад). Барои тасдиқи ниҳоӣ, H2APK-ро худ бо `go build` созед ва аз UI-и
// худи он дар DevTools → Network дархости воқеиро бинед — ин ба build-server/README.md
// низ навишта шудааст.
'use strict';

const BuildAPI = {
  baseUrl() {
    return Settings.get('h2apkServerUrl', '').replace(/\/+$/, '');
  },

  isConfigured() {
    return !!this.baseUrl();
  },

  async startBuild(payload) {
    const base = this.baseUrl();
    if (!base) {
      throw new Error('Сервери H2APK танзим нашудааст. Дар ТАНЗИМОТ нишонии сервери H2APK-и худмизбон (масалан http://localhost:8080)-ро ворид кунед.');
    }
    let res;
    try {
      res = await fetch(base + '/api/build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (netErr) {
      throw new Error(`Пайваст шудан ба сервери сохтмон имконнопазир аст: ${netErr.message}. Мутмаин шавед, ки H2APK дар "${base}" фаъол аст.`);
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
    if (!res.ok) {
      throw new Error(`Хатои воқеии сервери H2APK (HTTP ${res.status}): ${data.error || data.message || text || 'бе тафсил'}`);
    }
    if (!data.id && !data.build_id && !data.buildId) {
      throw new Error('Сервер ҷавоб дод, аммо ID-и сохтмон дар он ёфт нашуд. Формати ҷавоби воқеии сервер бо интизории ин барнома мувофиқат намекунад — тафсилоти пурраи ҷавоб: ' + text);
    }
    return data.id || data.build_id || data.buildId;
  },

  async getStatus(buildId) {
    const base = this.baseUrl();
    const res = await fetch(`${base}/api/status/${encodeURIComponent(buildId)}`);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
    if (!res.ok) throw new Error(`Хатои санҷиши ҳолат (HTTP ${res.status}): ${data.error || text}`);
    return data;
  },

  // SSE стрими лог — воқеӣ, бе фоизи қалбакӣ. onStage/onDone/onError фарохонда мешаванд
  // бо матни воқеии сатри лог, ки барномаи болоӣ онро ба марҳилаҳо мувофиқат мекунад.
  streamLog(buildId, { onLine, onError, onOpen }) {
    const base = this.baseUrl();
    if (!base) { onError && onError(new Error('Сервери H2APK танзим нашудааст.')); return null; }
    const es = new EventSource(`${base}/api/log/${encodeURIComponent(buildId)}`);
    es.onopen = () => onOpen && onOpen();
    es.onmessage = (e) => onLine && onLine(e.data);
    es.onerror = () => {
      onError && onError(new Error('Пайвастшавии SSE ба сервери H2APK қатъ шуд ё хато дод.'));
      es.close();
    };
    return es;
  },

  downloadUrl(buildId) {
    return `${this.baseUrl()}/api/download/${encodeURIComponent(buildId)}`;
  },

  // "Беҳтарин тахмини мустанад" — тибқи майдонҳои воқеии формаи зиндаи H2APK.
  // Агар сервер номи дигари майдонро талаб кунад, хатои воқеӣ инро ошкор мекунад.
  buildFormToPayload(form) {
    const payload = {
      appName: form.appName,
      packageId: form.packageId,
      version: form.version,
      versionCode: Number(form.versionCode) || 1,
      inputType: form.inputType // 'html' | 'url' | 'upload'
    };
    if (form.inputType === 'url') payload.url = form.url;
    if (form.inputType === 'html') {
      payload.html = form.html || '';
      payload.css = form.css || '';
      payload.js = form.js || '';
    }
    if (form.themeColor) payload.themeColor = form.themeColor;
    if (form.iconDataUrl) payload.icon = form.iconDataUrl;
    payload.pullToRefresh = !!form.pullToRefresh;
    payload.hideScrollbars = !!form.hideScrollbars;
    payload.transparentNavBar = !!form.transparentNavBar;
    payload.pinchZoom = !!form.pinchZoom;
    payload.disableCopy = !!form.disableCopy;
    if (form.splash && form.splash.enabled) {
      payload.splash = {
        durationSeconds: Number(form.splash.duration) || 2,
        backgroundColor: form.splash.background || '#000000',
        animation: form.splash.animation || 'fade'
      };
    }
    if (form.release) {
      payload.release = true;
      payload.minSdk = Number(form.minSdk) || undefined;
      payload.targetSdk = Number(form.targetSdk) || undefined;
      payload.allowHttp = !!form.allowHttp;
      // Калиди имзо — танҳо агар корбар худаш дод; вагарна аз H2APK хоҳиш мекунем
      // имзои худкорро истифода барад (агар дастгирӣ кунад).
      if (form.keystoreBase64) {
        payload.keystoreBase64 = form.keystoreBase64;
        payload.keystorePassword = form.keystorePassword;
        payload.keyAlias = form.keyAlias;
        payload.keyPassword = form.keyPassword || form.keystorePassword;
      }
    }
    return payload;
  }
};

window.BuildAPI = BuildAPI;

// ===== js/apk-builder.js ===== //
// apk-builder.js — мантиқи экрани "ТАБДИЛ БА APK". Ҳеҷ фоизи қалбакӣ,
// ҳеҷ APK-и қалбакӣ. Танҳо марҳилаҳои воқеӣ ва хатоҳои воқеии сервер.
'use strict';

const STAGES = [
  'Омодасозии лоиҳа',
  'Фиристодани лоиҳа',
  'Сохтани бастаи Android',
  'Тавлиди APK',
  'Имзогузорӣ',
  'Тайёр'
];

const ApkBuilder = {
  root: null,
  projectId: null,
  currentBuildId: null,
  es: null,

  mount(root) { this.root = root; },

  async open(projectId) {
    this.projectId = projectId;
    const project = await Projects.get(projectId);
    const configured = BuildAPI.isConfigured();

    this.root.innerHTML = `
      <div class="builder-form glass-panel">
        ${configured ? '' : `<div class="builder-warning">⚠ Сервери H2APK ҳанӯз дар ТАНЗИМОТ танзим нашудааст. Пеш аз сохтани APK, нишонии сервери H2APK-и худмизбонро илова кунед.</div>`}
        <label>1. НОМИ БАРНОМА
          <input type="text" id="bf-appname" value="${Utils.escapeHtml(project.name)}">
        </label>
        <label>2. PACKAGE NAME
          <input type="text" id="bf-package" placeholder="com.zerohubui.app" value="com.zerohubui.${(project.name || 'app').toLowerCase().replace(/[^a-z0-9]/g, '')}">
        </label>
        <div class="builder-row">
          <label>3. НУСХА
            <input type="text" id="bf-version" value="1.0.0">
          </label>
          <label>4. VERSION CODE
            <input type="number" id="bf-versioncode" value="1" min="1">
          </label>
        </div>
        <label>5. ИКОНКА (PNG)
          <input type="file" id="bf-icon" accept="image/png">
        </label>
        <label class="builder-check"><input type="checkbox" id="bf-release"> Сохтани нусхаи Play Store (имзои шахсӣ)</label>
        <div id="bf-release-fields" hidden>
          <label>Файли Keystore (.jks/.keystore)
            <input type="file" id="bf-keystore">
          </label>
          <div class="builder-row">
            <label>Пароли Keystore <input type="password" id="bf-ks-pass"></label>
            <label>Alias <input type="text" id="bf-ks-alias"></label>
          </div>
          <label>Пароли калид (агар аз пароли Keystore фарқ кунад)
            <input type="password" id="bf-key-pass">
          </label>
        </div>
        <p class="builder-hint">Агар имзои шахсӣ надиҳед, сервер (агар дастгирӣ кунад) имзои худкор истифода мебарад.</p>
        <button class="btn btn--primary btn--block" id="bf-submit">СОХТАНИ APK</button>
      </div>
      <div class="builder-progress glass-panel" id="bf-progress" hidden>
        <h3>Пешрафти сохтмон</h3>
        <ol class="builder-stages" id="bf-stages"></ol>
        <div class="builder-log" id="bf-log"></div>
        <div class="builder-result" id="bf-result"></div>
        <button class="btn btn--ghost" id="bf-cancel">Қатъ кардан</button>
      </div>`;

    this.root.querySelector('#bf-release').addEventListener('change', (e) => {
      this.root.querySelector('#bf-release-fields').hidden = !e.target.checked;
    });
    this.root.querySelector('#bf-submit').addEventListener('click', () => this._submit());
    this.root.querySelector('#bf-cancel').addEventListener('click', () => this._cancel());
  },

  _renderStages(activeIdx, failedIdx = -1) {
    const el = this.root.querySelector('#bf-stages');
    el.innerHTML = STAGES.map((s, i) => {
      let cls = '';
      if (failedIdx === i) cls = 'stage--failed';
      else if (i < activeIdx) cls = 'stage--done';
      else if (i === activeIdx) cls = 'stage--active';
      return `<li class="${cls}">${s}</li>`;
    }).join('');
  },

  _log(msg) {
    const el = this.root.querySelector('#bf-log');
    if (!el) return;
    const row = document.createElement('div');
    row.textContent = msg;
    el.appendChild(row);
    el.scrollTop = el.scrollHeight;
  },

  async _submit() {
    if (!BuildAPI.isConfigured()) {
      Notify.error('Аввал дар ТАНЗИМОТ нишонии сервери H2APK-ро ворид кунед.');
      return;
    }
    const appName = this.root.querySelector('#bf-appname').value.trim();
    const packageId = this.root.querySelector('#bf-package').value.trim();
    if (!appName) { Notify.error('Номи барномаро ворид кунед.'); return; }
    if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/i.test(packageId)) {
      Notify.error('Package name дуруст нест. Мисол: com.zerohubui.app'); return;
    }

    const nodes = await Files.allInProject(this.projectId);
    const indexNode = nodes.find((n) => n.type === 'file' && n.name === 'index.html' && !n.parentId);
    if (!indexNode) { Notify.error('index.html дар решаи лоиҳа ёфт нашуд.'); return; }
    const cssNode = nodes.find((n) => n.type === 'file' && n.name === 'style.css' && !n.parentId);
    const jsNode = nodes.find((n) => n.type === 'file' && n.name === 'script.js' && !n.parentId);

    const release = this.root.querySelector('#bf-release').checked;
    const form = {
      appName, packageId,
      version: this.root.querySelector('#bf-version').value.trim() || '1.0.0',
      versionCode: this.root.querySelector('#bf-versioncode').value,
      inputType: 'html',
      html: indexNode.content || '',
      css: cssNode ? cssNode.content : '',
      js: jsNode ? jsNode.content : '',
      release
    };

    const iconFile = this.root.querySelector('#bf-icon').files[0];
    if (iconFile) form.iconDataUrl = await Utils.readFileAsDataURL(iconFile);

    if (release) {
      const ksFile = this.root.querySelector('#bf-keystore').files[0];
      if (ksFile) {
        const dataUrl = await Utils.readFileAsDataURL(ksFile);
        form.keystoreBase64 = dataUrl.split(',')[1];
        form.keystorePassword = this.root.querySelector('#bf-ks-pass').value;
        form.keyAlias = this.root.querySelector('#bf-ks-alias').value;
        form.keyPassword = this.root.querySelector('#bf-key-pass').value;
      }
    }

    const payload = BuildAPI.buildFormToPayload(form);

    this.root.querySelector('.builder-form').hidden = true;
    this.root.querySelector('#bf-progress').hidden = false;
    this.root.querySelector('#bf-result').innerHTML = '';
    this._renderStages(0);
    this._log('Омодасозии лоиҳа барои фиристодан...');

    try {
      this._renderStages(1);
      this._log('Фиристодан ба сервери H2APK: ' + BuildAPI.baseUrl());
      const buildId = await BuildAPI.startBuild(payload);
      this.currentBuildId = buildId;
      this._log('Сохтмон оғоз шуд. ID: ' + buildId);
      this._renderStages(2);
      this._watch(buildId);
    } catch (e) {
      this._renderStages(1, 1);
      this._log('ХАТО: ' + e.message);
      Notify.error(e.message);
      this._showResult(false, e.message);
    }
  },

  _watch(buildId) {
    this.es = BuildAPI.streamLog(buildId, {
      onOpen: () => this._log('Пайваст ба стрими лог барқарор шуд.'),
      onLine: (line) => {
        this._log(line);
        if (/dex|d8/i.test(line)) this._renderStages(3);
        if (/sign|apksigner|имзо/i.test(line)) this._renderStages(4);
        if (/done|finish|тайёр|success/i.test(line)) this._onSuccess(buildId);
        if (/fail|error|хато/i.test(line)) this._onFail(line);
      },
      onError: (err) => {
        this._log('Хатои стрим: ' + err.message + ' — гузариш ба санҷиши даврии ҳолат.');
        this._poll(buildId);
      }
    });
  },

  async _poll(buildId) {
    try {
      const status = await BuildAPI.getStatus(buildId);
      const st = (status.status || status.state || '').toLowerCase();
      this._log('Ҳолат: ' + JSON.stringify(status));
      if (st.includes('done') || st.includes('success')) { this._onSuccess(buildId); return; }
      if (st.includes('fail') || st.includes('error')) { this._onFail(status.error || 'Хатои сохтмон'); return; }
      setTimeout(() => this._poll(buildId), 2500);
    } catch (e) {
      this._onFail(e.message);
    }
  },

  _onSuccess(buildId) {
    if (this.es) { this.es.close(); this.es = null; }
    this._renderStages(5);
    this._showResult(true, null, buildId);
    Notify.success('APK бомуваффақият сохта шуд.');
  },

  _onFail(message) {
    if (this.es) { this.es.close(); this.es = null; }
    this._renderStages(4, 4);
    this._log('ХАТО: ' + message);
    this._showResult(false, message);
    Notify.error('Сохтмон бо хато анҷом ёфт: ' + message);
  },

  _showResult(success, errorMsg, buildId) {
    const el = this.root.querySelector('#bf-result');
    if (success) {
      el.innerHTML = `<a class="btn btn--primary" href="${BuildAPI.downloadUrl(buildId)}" target="_blank" rel="noopener">Боргирии APK</a>`;
    } else {
      el.innerHTML = `<div class="builder-error">${Utils.escapeHtml(errorMsg || 'Хатои номаълум')}</div>`;
    }
  },

  _cancel() {
    if (this.es) { this.es.close(); this.es = null; }
    this.root.querySelector('.builder-form').hidden = false;
    this.root.querySelector('#bf-progress').hidden = true;
  }
};

window.ApkBuilder = ApkBuilder;

// settings.js — мантиқи экрани ТАНЗИМОТ
'use strict';

const SettingsUI = {
  root: null,
  mount(root) { this.root = root; },

  render() {
    const theme = Settings.get('theme', 'dark');
    const aiGlobal = Settings.get('aiGlobalAccess', true);
    const h2apkUrl = Settings.get('h2apkServerUrl', '');

    this.root.innerHTML = `
      <div class="settings-group glass-panel">
        <h3>Намуди намоиш</h3>
        <div class="settings-row">
          <span>Режим</span>
          <div class="segmented">
            <button class="seg-btn ${theme === 'light' ? 'active' : ''}" data-theme="light">Рӯзона</button>
            <button class="seg-btn ${theme === 'dark' ? 'active' : ''}" data-theme="dark">Торик</button>
          </div>
        </div>
      </div>

      <div class="settings-group glass-panel">
        <h3>Зеҳни сунъӣ</h3>
        <div class="settings-row">
          <span>Дастрасии Зеҳни сунъӣ ба тамоми барнома</span>
          <label class="switch">
            <input type="checkbox" id="set-ai-global" ${aiGlobal ? 'checked' : ''}>
            <span class="switch__track"></span>
          </label>
        </div>
        <div class="settings-row settings-row--col">
          <span>Нишонии сервери H2APK (худмизбон)</span>
          <input type="text" id="set-h2apk-url" placeholder="http://localhost:8080" value="${Utils.escapeHtml(h2apkUrl)}">
          <p class="settings-hint">Барои сохтани воқеии APK, H2APK-ро бо роҳнамои build-server/README.md худ роҳандозӣ кунед.</p>
        </div>
      </div>

      <div class="settings-group glass-panel">
        <h3>Маълумот</h3>
        <button class="btn btn--ghost btn--block" id="set-export">Содироти тамоми маълумот (EXPORT)</button>
        <label class="btn btn--ghost btn--block file-btn">
          Воридоти маълумот (IMPORT)
          <input type="file" id="set-import" accept=".json" hidden>
        </label>
        <button class="btn btn--ghost btn--block" id="set-clear-chat">Тоза кардани таърихи чат</button>
        <button class="btn btn--ghost btn--block" id="set-clear-code">Тоза кардани таърихи кодҳо (undo/redo)</button>
        <button class="btn btn--danger btn--block" id="set-clear-all">Тоза кардани ҳамаи маълумоти маҳаллӣ</button>
      </div>

      <div class="settings-group glass-panel">
        <h3>Дар бораи барнома</h3>
        <p>ZEROHUBUIAL — платформаи вебие, ки дар он корбар лоиҳаи HTML/CSS/JS месозад
        ва баъд онро тавассути муҳаррики воқеии H2APK ба APK-и Android табдил медиҳад.
        Ҳамаи маълумоти лоиҳа дар дастгоҳи худи шумо (IndexedDB/localStorage) нигоҳ дошта мешавад.</p>
      </div>`;

    this.root.querySelectorAll('.seg-btn').forEach((btn) => {
      btn.onclick = () => {
        Settings.set('theme', btn.dataset.theme);
        App.applyTheme();
        this.render();
      };
    });

    this.root.querySelector('#set-ai-global').onchange = (e) => {
      Settings.set('aiGlobalAccess', e.target.checked);
      Notify.info(e.target.checked ? 'Зеҳни сунъӣ дар тамоми барнома фаъол шуд.' : 'Зеҳни сунъӣ танҳо дар бахши иҷозатдодашуда фаъол хоҳад буд.');
    };

    this.root.querySelector('#set-h2apk-url').onchange = (e) => {
      Settings.set('h2apkServerUrl', e.target.value.trim());
      Notify.success('Нишонии сервери H2APK нигоҳ дошта шуд.');
    };

    this.root.querySelector('#set-export').onclick = () => ImportExport.exportAll();
    this.root.querySelector('#set-import').onchange = (e) => {
      if (e.target.files[0]) ImportExport.importAll(e.target.files[0]);
    };
    this.root.querySelector('#set-clear-chat').onclick = async () => {
      const ok = await Notify.confirmDialog('Тоза кардани чат', 'Тамоми таърихи чатҳо нест карда мешавад. Идома медиҳед?');
      if (!ok) return;
      const chats = await DB.getAll(DB.STORES.CHATS);
      for (const c of chats) { c.messages = []; await DB.put(DB.STORES.CHATS, c); }
      Notify.success('Таърихи чат тоза шуд.');
    };
    this.root.querySelector('#set-clear-code').onclick = async () => {
      Editor.undoStack = [Editor.getValue()];
      Editor.redoStack = [];
      Notify.success('Таърихи бекоркунии муҳаррир тоза шуд.');
    };
    this.root.querySelector('#set-clear-all').onclick = async () => {
      const ok = await Notify.confirmDialog('Тоза кардани ҳама маълумот', 'Ин амал ҳамаи лоиҳаҳо, файлҳо, калидҳо ва танзимотро бебозгашт нест мекунад. Мутмаин ҳастед?', 'НЕСТ КАРДАН');
      if (!ok) return;
      await DB.clearAll();
      Settings.clearAll();
      Notify.success('Ҳамаи маълумот тоза шуд.');
      setTimeout(() => location.reload(), 800);
    };
  }
};

window.SettingsUI = SettingsUI;

// ===== js/import-export.js ===== //
// import-export.js — содирот/воридоти воқеии маълумот (JSON) ва лоиҳа ба ZIP
'use strict';

const ImportExport = {
  async exportAll() {
    const [projects, nodes, chats, keys] = await Promise.all([
      DB.getAll(DB.STORES.PROJECTS),
      DB.getAll(DB.STORES.NODES),
      DB.getAll(DB.STORES.CHATS),
      DB.getAll(DB.STORES.AI_KEYS)
    ]);
    const bundle = {
      app: 'ZEROHUBUIAL',
      exportedAt: new Date().toISOString(),
      version: 1,
      projects, nodes, chats,
      // Эзоҳ: калидҳои API дар содирот НАМЕОЯНД, зеро онҳо ҳассосанд.
      aiKeysMeta: keys.map((k) => ({ name: k.name, service: k.service, model: k.model }))
    };
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
    Utils.downloadBlob(blob, `zerohubuial-export-${Date.now()}.json`);
    Notify.success('Содирот омода шуд (калидҳои API дохил карда нашуданд).');
  },

  async importAll(file) {
    try {
      const text = await Utils.readFileAsText(file);
      const data = JSON.parse(text);
      if (data.app !== 'ZEROHUBUIAL') throw new Error('Ин файли содироти ZEROHUBUIAL нест.');
      for (const p of data.projects || []) await DB.put(DB.STORES.PROJECTS, p);
      for (const n of data.nodes || []) await DB.put(DB.STORES.NODES, n);
      for (const c of data.chats || []) await DB.put(DB.STORES.CHATS, c);
      Notify.success(`Воридот тайёр шуд: ${(data.projects || []).length} лоиҳа.`);
      document.dispatchEvent(new CustomEvent('zh:data-imported'));
    } catch (e) {
      Notify.error('Хатои воридот: ' + e.message);
    }
  },

  async exportProjectAsZip(projectId) {
    if (typeof JSZip === 'undefined') {
      Notify.error('Китобхонаи ZIP бор нашудааст (пайвасти интернет лозим аст).');
      return;
    }
    const project = await Projects.get(projectId);
    const nodes = await Files.allInProject(projectId);
    const zip = new JSZip();

    const pathById = {};
    const buildPath = (id) => {
      if (pathById[id]) return pathById[id];
      const n = nodes.find((x) => x.id === id);
      if (!n) return '';
      const p = n.parentId ? buildPath(n.parentId) + '/' + n.name : n.name;
      pathById[id] = p;
      return p;
    };
    nodes.forEach((n) => buildPath(n.id));

    nodes.filter((n) => n.type === 'file').forEach((n) => {
      zip.file(pathById[n.id], n.content || '');
    });

    const blob = await zip.generateAsync({ type: 'blob' });
    Utils.downloadBlob(blob, `${(project.name || 'project').replace(/\s+/g, '-')}.zip`);
    Notify.success('Лоиҳа ҳамчун ZIP содир шуд.');
  }
};

window.ImportExport = ImportExport;

// ===== app.js ===== //
// app.js — назорати марказии барнома: экранҳо, роутинг, ҳодисаҳо
'use strict';

const App = {
  currentProjectId: null,
  currentFileId: null,

  async init() {
    Notify.init();
    this._wireGlobalErrorReporting();
    await this._checkEnvironment();
    this.applyTheme();
    this._wireIntro();
    this._wireHeader();
    this._wireSideMenu();

    Router
      .on('/home', () => this.showView('home'))
      .on('/projects', () => this._safe(this._renderProjects))
      .on('/project/:id', (p) => this._safe(() => this._renderProjectDetail(p.id)))
      .on('/editor/:projectId/:fileId', (p) => this._safe(() => this._renderEditor(p.projectId, p.fileId)))
      .on('/ai-keys', () => this._safe(this._renderAiKeys))
      .on('/chat/:projectId', (p) => this._safe(() => this._renderProjectChat(p.projectId)))
      .on('/al-chat', () => this._safe(this._renderAlChat))
      .on('/settings', () => this._safe(() => { this.showView('settings'); SettingsUI.mount(document.getElementById('view-settings')); SettingsUI.render(); }))
      .on('/builder/:projectId', (p) => this._safe(() => this._renderBuilder(p.projectId)));

    document.addEventListener('zh:run-error', (e) => this._onRunError(e.detail.message));

    Router.start();
    this._maybeShowIntro();
  },

  // Иҷрои бехатари ҳар render — хатои воқеӣ ба toast мебарояд, на пинҳон мешавад
  async _safe(fn) {
    try {
      await fn.call(this);
    } catch (e) {
      console.error(e);
      Notify.error('Хатои экран: ' + (e && e.message ? e.message : String(e)));
    }
  },

  // Ҳар хатои JavaScript-и сабтнашуда ва Promise-и радшуда ба корбар нишон дода мешавад
  _wireGlobalErrorReporting() {
    window.addEventListener('error', (e) => {
      console.error(e.error || e.message);
      Notify.error('Хатои JavaScript: ' + (e.message || 'номаълум'));
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error(e.reason);
      const msg = (e.reason && e.reason.message) || String(e.reason);
      Notify.error('Хатои иҷронашуда: ' + msg);
    });
  },

  // Санҷиши муҳити воқеӣ: агар IndexedDB дастнорас бошад (масалан кушодан аз
  // file:// бе сервер), ба корбар роҳи ҳали равшан нишон дода мешавад — на
  // шикасти хомӯш.
  async _checkEnvironment() {
    const banner = () => {
      const el = document.createElement('div');
      el.className = 'env-warning glass-panel';
      el.innerHTML = `
        <strong>⚠ Барнома наметавонад маълумотро нигоҳ дорад.</strong>
        <p>Эҳтимол шумо ин файлро мустақим (file://) кушодаед. Лутфан онро аз
        сервери маҳаллӣ кушоед, масалан:</p>
        <code>npx serve .</code>
        <p>ё</p>
        <code>python3 -m http.server</code>
        <button class="btn btn--sm" id="env-warning-close">Фаҳмидам</button>`;
      document.body.appendChild(el);
      el.querySelector('#env-warning-close').onclick = () => el.remove();
    };

    if (typeof indexedDB === 'undefined' || !indexedDB) {
      banner();
      return;
    }
    try {
      await DB.getAll(DB.STORES.PROJECTS); // санҷиши воқеии кушодашавии база
    } catch (e) {
      console.error('IndexedDB дастнорас аст:', e);
      banner();
    }
  },

  applyTheme() {
    const theme = Settings.get('theme', 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  },

  showView(name) {
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('view--active'));
    const el = document.getElementById('view-' + name);
    if (el) el.classList.add('view--active');
    document.getElementById('side-menu').classList.remove('open');
    document.getElementById('menu-overlay').classList.remove('open');
  },

  // ---------- INTRO ----------
  _maybeShowIntro() {
    const seen = Settings.get('introSeen', false);
    const introScreen = document.getElementById('intro-screen');
    if (seen) { introScreen.hidden = true; return; }
    introScreen.hidden = false;
    const video = document.getElementById('intro-video');
    video.addEventListener('ended', () => this._finishIntro());
    video.addEventListener('error', () => this._finishIntro()); // assets/intro.mp4 то ҳол гузошта нашудааст
    video.play().catch(() => this._finishIntro());
  },

  _wireIntro() {
    document.getElementById('intro-skip').addEventListener('click', () => this._finishIntro());
  },

  _finishIntro() {
    Settings.set('introSeen', true);
    const introScreen = document.getElementById('intro-screen');
    introScreen.classList.add('fade-out');
    setTimeout(() => { introScreen.hidden = true; }, 400);
  },

  // ---------- HEADER / MENU ----------
  _wireHeader() {
    document.getElementById('menu-toggle').addEventListener('click', () => this._toggleMenu(true));
    document.getElementById('menu-overlay').addEventListener('click', () => this._toggleMenu(false));
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = Settings.get('theme', 'dark');
      Settings.set('theme', cur === 'dark' ? 'light' : 'dark');
      this.applyTheme();
    });
    document.getElementById('back-btn').addEventListener('click', () => Router.back());
  },

  _toggleMenu(open) {
    document.getElementById('side-menu').classList.toggle('open', open);
    document.getElementById('menu-overlay').classList.toggle('open', open);
  },

  _wireSideMenu() {
    document.querySelectorAll('[data-go]').forEach((btn) => {
      btn.addEventListener('click', () => Router.go(btn.dataset.go));
    });
  },

  // ---------- PROJECTS LIST ----------
  async _renderProjects() {
    this.showView('projects');
    const listEl = document.getElementById('projects-list');
    const projects = await Projects.list();
    listEl.innerHTML = projects.length ? '' : '<p class="empty-hint">Ҳанӯз лоиҳае нест. Тугмаи "+"-ро пахш кунед.</p>';
    for (const p of projects) {
      const stats = await Projects.stats(p.id);
      const card = document.createElement('div');
      card.className = 'project-card glass-panel';
      card.innerHTML = `
        <div class="project-card__main">
          <h3>${Utils.escapeHtml(p.name)}</h3>
          <p>${stats.fileCount} файл · ${stats.folderCount} папка · ${Utils.formatBytes(stats.size)}</p>
          <p class="project-card__date">${Utils.formatDate(p.updatedAt)}</p>
        </div>
        <button class="icon-btn project-card__menu" data-id="${p.id}">⋮</button>`;
      card.querySelector('.project-card__main').addEventListener('click', () => Router.go(`#/project/${p.id}`));
      card.querySelector('.project-card__menu').addEventListener('click', (e) => {
        e.stopPropagation();
        this._projectMenu(p);
      });
      listEl.appendChild(card);
    }
  },

  async _projectMenu(project) {
    const action = await this._pickOption(project.name, [
      { key: 'open', label: 'Кушодан' },
      { key: 'rename', label: 'Номи нав' },
      { key: 'export', label: 'Содирот ба ZIP' },
      { key: 'delete', label: 'Нест кардан', danger: true }
    ]);
    if (action === 'open') Router.go(`#/project/${project.id}`);
    if (action === 'rename') {
      const name = await Notify.promptDialog('Номи нави лоиҳа', project.name);
      if (name) { await Projects.rename(project.id, name); this._renderProjects(); }
    }
    if (action === 'export') ImportExport.exportProjectAsZip(project.id);
    if (action === 'delete') {
      const ok = await Notify.confirmDialog('Нест кардани лоиҳа', `Лоиҳаи "${project.name}" бо ҳамаи файлҳояш бебозгашт нест мешавад.`, 'НЕСТ КАРДАН');
      if (ok) { await Projects.remove(project.id); this._renderProjects(); Notify.success('Лоиҳа нест шуд.'); }
    }
  },

  // менюи интихобӣ (иваз мекунад menu-ро бо тугмаҳои шишагӣ)
  _pickOption(title, options) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal glass-panel action-sheet">
          <h3 class="modal__title">${Utils.escapeHtml(title)}</h3>
          <div class="action-sheet__list">
            ${options.map((o) => `<button class="action-sheet__item ${o.danger ? 'danger' : ''}" data-key="${o.key}">${o.label}</button>`).join('')}
          </div>
          <button class="btn btn--ghost btn--block" data-key="__cancel">БЕКОР</button>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const close = (val) => { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 200); resolve(val); };
      overlay.querySelectorAll('[data-key]').forEach((btn) => {
        btn.onclick = () => close(btn.dataset.key === '__cancel' ? null : btn.dataset.key);
      });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
    });
  },

  _wireNewProjectBtn() {
    document.getElementById('new-project-btn').addEventListener('click', async () => {
      const name = await Notify.promptDialog('Номи лоиҳаи нав', 'Лоиҳаи нав');
      if (!name) return;
      const p = await Projects.create(name);
      Notify.success('Лоиҳа сохта шуд.');
      Router.go(`#/project/${p.id}`);
    });
  },

  // ---------- PROJECT DETAIL (файлҳо/папкаҳо) ----------
  async _renderProjectDetail(projectId) {
    this.currentProjectId = projectId;
    this.showView('project');
    const project = await Projects.get(projectId);
    if (!project) { Router.go('#/projects'); return; }
    document.getElementById('project-title').textContent = project.name;
    this._treeParentStack = [null];
    await this._renderTreeLevel(projectId, null);

    document.getElementById('pt-new-folder').onclick = () => this._createNode(projectId, 'folder');
    document.getElementById('pt-new-file').onclick = () => this._createNode(projectId, 'file');
    document.getElementById('pt-ai').onclick = () => Router.go(`#/chat/${projectId}`);
    document.getElementById('pt-import').onclick = () => this._importFiles(projectId);
    document.getElementById('pt-build').onclick = () => Router.go(`#/builder/${projectId}`);
  },

  async _renderTreeLevel(projectId, parentId) {
    const treeEl = document.getElementById('project-tree');
    const kids = await Files.children(projectId, parentId);

    // хатти масир (breadcrumb)
    const crumbEl = document.getElementById('project-breadcrumb');
    const crumbs = [];
    let cursor = parentId;
    while (cursor) {
      const n = await Files.get(cursor);
      crumbs.unshift(n);
      cursor = n ? n.parentId : null;
    }
    crumbEl.innerHTML = `<span data-parent="" class="crumb">лоиҳа</span>` +
      crumbs.map((n) => `<span class="crumb-sep">/</span><span class="crumb" data-parent="${n.id}">${Utils.escapeHtml(n.name)}</span>`).join('');
    crumbEl.querySelectorAll('.crumb').forEach((c) => {
      c.onclick = () => this._renderTreeLevel(projectId, c.dataset.parent || null);
    });

    treeEl.innerHTML = kids.length ? '' : '<p class="empty-hint">Ин папка холист.</p>';
    for (const node of kids) {
      const row = document.createElement('div');
      row.className = 'tree-row glass-row';
      row.innerHTML = `
        <span class="tree-row__icon">${Utils.iconForNode(node.type, node.name)}</span>
        <span class="tree-row__name"></span>
        <button class="icon-btn tree-row__menu">⋮</button>`;
      row.querySelector('.tree-row__name').textContent = node.name;
      row.querySelector('.tree-row__name').addEventListener('click', () => {
        if (node.type === 'folder') this._renderTreeLevel(projectId, node.id);
        else Router.go(`#/editor/${projectId}/${node.id}`);
      });
      row.querySelector('.tree-row__menu').addEventListener('click', (e) => {
        e.stopPropagation();
        this._nodeMenu(node, parentId);
      });
      treeEl.appendChild(row);
    }
  },

  async _nodeMenu(node, currentParentId) {
    const opts = [{ key: 'open', label: 'Кушодан' }];
    if (node.type === 'folder') {
      opts.push({ key: 'new-file', label: 'Эҷоди файл' }, { key: 'new-folder', label: 'Эҷоди папка' });
    }
    opts.push(
      { key: 'rename', label: 'Номи нав' },
      { key: 'duplicate', label: 'Нусха гирифтан' },
      { key: 'move', label: 'Ҷойивазкунӣ' },
      { key: 'delete', label: 'Нест кардан', danger: true }
    );
    const action = await this._pickOption(node.name, opts);
    if (!action) return;

    if (action === 'open') {
      if (node.type === 'folder') this._renderTreeLevel(node.projectId, node.id);
      else Router.go(`#/editor/${node.projectId}/${node.id}`);
    }
    if (action === 'new-file') this._createNode(node.projectId, 'file', node.id);
    if (action === 'new-folder') this._createNode(node.projectId, 'folder', node.id);
    if (action === 'rename') {
      const name = await Notify.promptDialog('Номи нав', node.name);
      if (name) {
        try { await Files.rename(node.id, name); this._renderTreeLevel(node.projectId, currentParentId); }
        catch (e) { Notify.error(e.message); }
      }
    }
    if (action === 'duplicate') {
      try { await Files.duplicate(node.id); this._renderTreeLevel(node.projectId, currentParentId); Notify.success('Нусха гирифта шуд.'); }
      catch (e) { Notify.error(e.message); }
    }
    if (action === 'move') {
      const targetId = await this._pickFolder(node.projectId, node.id);
      if (targetId !== undefined) {
        try { await Files.move(node.id, targetId); this._renderTreeLevel(node.projectId, currentParentId); Notify.success('Ҷойивазкунӣ анҷом ёфт.'); }
        catch (e) { Notify.error(e.message); }
      }
    }
    if (action === 'delete') {
      const ok = await Notify.confirmDialog('Нест кардан', `"${node.name}"-ро бо тамоми мундариҷааш нест кунам?`, 'НЕСТ КАРДАН');
      if (ok) { await Files.delete(node.id); this._renderTreeLevel(node.projectId, currentParentId); Notify.success('Нест шуд.'); }
    }
  },

  async _pickFolder(projectId, excludeId) {
    const all = await Files.allInProject(projectId);
    const folders = all.filter((n) => n.type === 'folder' && n.id !== excludeId);
    const pathById = {};
    const buildPath = (id) => {
      if (pathById[id]) return pathById[id];
      const n = all.find((x) => x.id === id);
      if (!n) return '';
      const p = n.parentId ? buildPath(n.parentId) + '/' + n.name : n.name;
      pathById[id] = p;
      return p;
    };
    folders.forEach((f) => buildPath(f.id));
    const options = [{ key: 'root', label: '(реша)' }].concat(
      folders.map((f) => ({ key: f.id, label: pathById[f.id] }))
    );
    const result = await this._pickOption('Ба куҷо гузаронда шавад?', options);
    if (result === null) return undefined;
    return result === 'root' ? null : result;
  },

  async _createNode(projectId, type, parentId = null) {
    const label = type === 'folder' ? 'Номи папка' : 'Номи файл';
    const def = type === 'folder' ? '' : 'file.html';
    const name = await Notify.promptDialog(label, def);
    if (!name) return;
    try {
      if (type === 'folder') await Files.createFolder(projectId, parentId, name);
      else await Files.createFile(projectId, parentId, name, '');
      this._renderTreeLevel(projectId, parentId);
      Notify.success((type === 'folder' ? 'Папка' : 'Файл') + ' сохта шуд.');
    } catch (e) {
      Notify.error(e.message);
    }
  },

  async _importFiles(projectId) {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.html,.htm,.css,.js,.json,.txt,.svg,image/*,video/*,.zip';
    input.onchange = async () => {
      for (const file of Array.from(input.files)) {
        try {
          const content = Utils.isTextFile(file.name) ? await Utils.readFileAsText(file) : await Utils.readFileAsDataURL(file);
          await Files.createFile(projectId, null, file.name, content);
        } catch (e) {
          Notify.error(`Хатои ворид кардани ${file.name}: ${e.message}`);
        }
      }
      Notify.success('Файлҳо ворид карда шуданд.');
      this._renderTreeLevel(projectId, null);
    };
    input.click();
  },

  // ---------- EDITOR + RUN + CONSOLE ----------
  async _renderEditor(projectId, fileId) {
    this.currentProjectId = projectId;
    this.currentFileId = fileId;
    this.showView('editor');
    const node = await Files.get(fileId);
    if (!node) { Router.go(`#/project/${projectId}`); return; }

    Editor.mount(document.getElementById('editor-container'));
    await Editor.open(node);

    Run.mount(document.getElementById('run-container'));
    Console.mount(document.getElementById('console-container'));

    document.getElementById('editor-tab-code').onclick = () => this._editorTab('code');
    document.getElementById('editor-tab-run').onclick = () => this._editorTab('run');
    document.getElementById('editor-run-btn').onclick = async () => {
      await Editor.forceSave();
      this._editorTab('run');
      await Run.execute(projectId);
    };
    this._editorTab('code');
  },

  _editorTab(tab) {
    document.getElementById('editor-container').hidden = tab !== 'code';
    document.getElementById('run-panel').hidden = tab !== 'run';
    document.getElementById('editor-tab-code').classList.toggle('active', tab === 'code');
    document.getElementById('editor-tab-run').classList.toggle('active', tab === 'run');
  },

  async _onRunError(message) {
    const bar = document.getElementById('error-banner');
    bar.hidden = false;
    document.getElementById('error-banner-text').textContent = message;
    document.getElementById('error-fix-yes').onclick = () => this._askAiToFix(message);
    document.getElementById('error-fix-no').onclick = () => { bar.hidden = true; };
  },

  async _askAiToFix(errorMessage) {
    document.getElementById('error-banner').hidden = true;
    Notify.info('Зеҳни сунъӣ хатогиро таҳлил мекунад...');
    try {
      const node = await Files.get(this.currentFileId);
      await Chat.load(this.currentProjectId);
      const { reply, actions } = await Chat.sendProjectMessage(
        this.currentProjectId,
        `Дар файли "${node.name}" ин хатогӣ пайдо шуд: "${errorMessage}". Лутфан онро ислоҳ кун ва тавассути блоки zh-action (edit_file) тағйироти пешниҳодшударо пешниҳод кун.`
      );
      if (actions.length) {
        await this._confirmActions(this.currentProjectId, actions, reply);
      } else {
        Notify.warn('Зеҳни сунъӣ тағйироти мушаххас пешниҳод накард. Ҷавоб: ' + reply.slice(0, 200));
      }
    } catch (e) {
      Notify.error('Хатои Зеҳни сунъӣ: ' + e.message);
    }
  },

  async _confirmActions(projectId, actions, replyText) {
    for (const action of actions) {
      const ok = await Notify.confirmDialog(
        'Тағйироти пешниҳодшуда',
        `Зеҳни сунъӣ пешниҳод мекунад: ${action.action} → ${action.path || ''}`,
        'ҚАБУЛ КАРДАН', 'РАД КАРДАН'
      );
      if (ok) {
        try {
          await Chat.applyAction(projectId, action);
          Notify.success('Тағйирот татбиқ шуд.');
          if (action.path && this.currentFileId) {
            const node = await Files.get(this.currentFileId);
            if (node) await Editor.open(node);
          }
        } catch (e) {
          Notify.error('Хатои татбиқ: ' + e.message);
        }
      }
    }
  },

  // ---------- AI KEYS ----------
  async _renderAiKeys() {
    this.showView('ai-keys');
    await this._refreshAiKeysList();
    document.getElementById('ak-add-btn').onclick = () => this._addAiKeyForm();
  },

  async _refreshAiKeysList() {
    const listEl = document.getElementById('ai-keys-list');
    const keys = await AIKeys.list();
    listEl.innerHTML = keys.length ? '' : '<p class="empty-hint">Ягон калид илова нашудааст.</p>';
    for (const k of keys) {
      const row = document.createElement('div');
      row.className = 'key-row glass-panel';
      row.innerHTML = `
        <div class="key-row__main">
          <strong>${Utils.escapeHtml(k.name)}</strong>
          <span class="key-row__meta">${Utils.escapeHtml(k.service)} · ${Utils.escapeHtml(k.model || 'модели пешфарз')}</span>
        </div>
        <div class="key-row__actions">
          <label class="switch"><input type="checkbox" ${k.active ? 'checked' : ''} class="key-active"><span class="switch__track"></span></label>
          <button class="icon-btn key-test" title="Санҷиши пайвастшавӣ">🔌</button>
          <button class="icon-btn key-edit" title="Таҳрир">✏️</button>
          <button class="icon-btn key-del" title="Нест кардан">🗑️</button>
        </div>`;
      row.querySelector('.key-active').onchange = async () => { await AIKeys.toggleActive(k.id); };
      row.querySelector('.key-test').onclick = async () => {
        Notify.info('Санҷиши пайвастшавӣ...');
        const res = await AIKeys.testConnection(k.id);
        res.ok ? Notify.success('Пайвастшавӣ муваффақ буд.') : Notify.error('Хато: ' + res.error);
      };
      row.querySelector('.key-edit').onclick = () => this._addAiKeyForm(k);
      row.querySelector('.key-del').onclick = async () => {
        const ok = await Notify.confirmDialog('Нест кардани калид', `Калиди "${k.name}" нест карда шавад?`, 'НЕСТ КАРДАН');
        if (ok) { await AIKeys.remove(k.id); this._refreshAiKeysList(); }
      };
      listEl.appendChild(row);
    }
  },

  async _addAiKeyForm(existing) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal glass-panel">
        <h3 class="modal__title">${existing ? 'Таҳрири калид' : 'Калиди нав'}</h3>
        <label>Ном <input id="akf-name" type="text" value="${existing ? Utils.escapeHtml(existing.name) : ''}"></label>
        <label>Хизматрасонӣ
          <select id="akf-service">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI</option>
            <option value="groq">Groq</option>
            <option value="gemini">Google Gemini</option>
            <option value="custom">Дигар (форматаи OpenAI-мувофиқ)</option>
          </select>
        </label>
        <label>API Key <input id="akf-key" type="password" value="${existing ? Utils.escapeHtml(existing.apiKey) : ''}"></label>
        <label>Модел (ихтиёрӣ — масалан: claude-sonnet-4-6, gpt-4o-mini, llama-3.3-70b-versatile, gemini-2.5-flash)
          <input id="akf-model" type="text" value="${existing ? Utils.escapeHtml(existing.model || '') : ''}">
        </label>
        <label>Base URL (танҳо агар лозим бошад — Groq/Gemini худашон пешфарз доранд)
          <input id="akf-baseurl" type="text" value="${existing ? Utils.escapeHtml(existing.baseUrl || '') : ''}">
        </label>
        <div class="modal__actions">
          <button class="btn btn--ghost" data-act="cancel">БЕКОР</button>
          <button class="btn btn--primary" data-act="save">НИГОҲ ДОШТАН</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    if (existing) overlay.querySelector('#akf-service').value = existing.service;
    const close = () => { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 200); };
    overlay.querySelector('[data-act="cancel"]').onclick = close;
    overlay.querySelector('[data-act="save"]').onclick = async () => {
      const data = {
        name: overlay.querySelector('#akf-name').value.trim() || 'Калид',
        service: overlay.querySelector('#akf-service').value,
        apiKey: overlay.querySelector('#akf-key').value.trim(),
        model: overlay.querySelector('#akf-model').value.trim(),
        baseUrl: overlay.querySelector('#akf-baseurl').value.trim()
      };
      if (!data.apiKey) { Notify.error('API Key-ро ворид кунед.'); return; }
      if (existing) await AIKeys.update(existing.id, data);
      else await AIKeys.add(data);
      close();
      this._refreshAiKeysList();
      Notify.success('Калид нигоҳ дошта шуд.');
    };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  },

  // ---------- CHAT (дохили лоиҳа) ----------
  async _renderProjectChat(projectId) {
    this.showView('chat');
    document.getElementById('chat-title').textContent = 'Зеҳни сунъӣ';
    await Chat.load(projectId);
    this._renderChatMessages();
    document.getElementById('chat-send').onclick = () => this._sendProjectChat(projectId);
    document.getElementById('chat-input').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._sendProjectChat(projectId); }
    };
  },

  async _sendProjectChat(projectId) {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    this._renderChatMessages();
    const sendBtn = document.getElementById('chat-send');
    sendBtn.disabled = true;
    try {
      const { reply, actions } = await Chat.sendProjectMessage(projectId, text);
      this._renderChatMessages();
      if (actions.length) await this._confirmActions(projectId, actions, reply);
    } catch (e) {
      Notify.error(e.message);
    } finally {
      sendBtn.disabled = false;
    }
  },

  _renderChatMessages(scopeEl = 'chat-messages') {
    const el = document.getElementById(scopeEl);
    el.innerHTML = Chat.history.map((m) => {
      const cleanText = (m.content || '').replace(ACTION_BLOCK_RE_GLOBAL(), '').trim();
      return `<div class="chat-msg chat-msg--${m.role}"><div class="chat-msg__bubble">${Utils.escapeHtml(cleanText)}</div></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  },

  // ---------- AL CHAT (умумӣ) ----------
  async _renderAlChat() {
    this.showView('al-chat');
    await Chat.load('AL_CHAT');
    this._renderChatMessages('al-chat-messages');
    document.getElementById('al-chat-send').onclick = () => this._sendAlChat();
    document.getElementById('al-chat-input').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._sendAlChat(); }
    };
  },

  async _sendAlChat() {
    const input = document.getElementById('al-chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    this._renderChatMessages('al-chat-messages');
    try {
      await Chat.sendAlChatMessage(text);
      this._renderChatMessages('al-chat-messages');
    } catch (e) {
      Notify.error(e.message);
    }
  },

  // ---------- APK BUILDER ----------
  async _renderBuilder(projectId) {
    this.showView('builder');
    ApkBuilder.mount(document.getElementById('view-builder').querySelector('.builder-body'));
    await ApkBuilder.open(projectId);
  }
};

function ACTION_BLOCK_RE_GLOBAL() {
  return /```zh-action\s*([\s\S]*?)```/g;
}

window.addEventListener('DOMContentLoaded', () => {
  App.init();
  App._wireNewProjectBtn();
});

</script>
</body>
</html>
