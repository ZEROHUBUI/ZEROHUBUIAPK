<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ZEROHUBUIAL — Web APK Builder</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/builder.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-theme="dark">

<!-- ==================== INTRO ==================== -->
<div id="intro-screen">
  <video id="intro-video" src="assets/intro.mp4" playsinline muted></video>
  <button id="intro-skip" class="btn btn--ghost">Гузаштан ›</button>
  <div class="intro-fallback">
    <div class="intro-fallback__logo">ZEROHUBUIAL</div>
    <p>HTML + CSS + JS → APK</p>
  </div>
</div>

<div id="app">

  <!-- ==================== HEADER ==================== -->
  <header id="app-header" class="glass-panel">
    <button id="menu-toggle" class="icon-btn" aria-label="Меню">☰</button>
    <button id="back-btn" class="icon-btn" aria-label="Бозгашт">←</button>
    <h1 class="app-header__title">ZEROHUBUIAL</h1>
    <button id="theme-toggle" class="icon-btn" aria-label="Мавзӯъ">🌓</button>
  </header>

  <!-- ==================== SIDE MENU ==================== -->
  <div id="menu-overlay"></div>
  <nav id="side-menu" class="glass-panel">
    <button class="side-menu__item" data-go="#/home">🏠 Экрани асосӣ</button>
    <button class="side-menu__item" data-go="#/projects">📁 Лоиҳаҳо</button>
    <button class="side-menu__item" data-go="#/ai-keys">🔑 Калидҳои Зеҳни сунъӣ</button>
    <button class="side-menu__item" data-go="#/al-chat">💬 AL CHAT</button>
    <button class="side-menu__item" data-go="#/settings">⚙️ Танзимот</button>
  </nav>

  <main id="app-main">

    <!-- ==================== HOME ==================== -->
    <section id="view-home" class="view view--active">
      <div class="home-grid">
        <button class="home-card glass-panel" data-go="#/projects">
          <span class="home-card__icon">📁</span>
          <span class="home-card__label">ЛОИҲАҲО</span>
        </button>
        <button class="home-card glass-panel" data-go="#/ai-keys">
          <span class="home-card__icon">🔑</span>
          <span class="home-card__label">КАЛИДҲОИ ЗЕҲНИ СУНЪӢ</span>
        </button>
        <button class="home-card glass-panel" data-go="#/settings">
          <span class="home-card__icon">⚙️</span>
          <span class="home-card__label">ТАНЗИМОТ</span>
        </button>
        <button class="home-card glass-panel" data-go="#/al-chat">
          <span class="home-card__icon">💬</span>
          <span class="home-card__label">AL CHAT</span>
        </button>
      </div>
    </section>

    <!-- ==================== PROJECTS LIST ==================== -->
    <section id="view-projects" class="view">
      <div class="view-toolbar">
        <h2>Лоиҳаҳо</h2>
        <button id="new-project-btn" class="btn btn--primary btn--round">+</button>
      </div>
      <div id="projects-list" class="projects-list"></div>
    </section>

    <!-- ==================== PROJECT DETAIL ==================== -->
    <section id="view-project" class="view">
      <div class="view-toolbar">
        <h2 id="project-title">—</h2>
      </div>
      <div id="project-breadcrumb" class="breadcrumb"></div>
      <div class="project-toolbar">
        <button id="pt-new-folder" class="btn btn--sm">📁 ПАПКАИ НАВ</button>
        <button id="pt-new-file" class="btn btn--sm">📄 ФАЙЛИ НАВ</button>
        <button id="pt-ai" class="btn btn--sm">🤖 ЗЕҲНИ СУНЪӢ</button>
        <button id="pt-import" class="btn btn--sm">⬆️ ИМПОРТ</button>
        <button id="pt-build" class="btn btn--sm btn--accent">📦 ТАБДИЛ БА APK</button>
      </div>
      <div id="project-tree" class="project-tree"></div>
    </section>

    <!-- ==================== EDITOR / RUN / CONSOLE ==================== -->
    <section id="view-editor" class="view">
      <div id="error-banner" class="error-banner glass-panel" hidden>
        <span id="error-banner-text"></span>
        <div class="error-banner__actions">
          <button id="error-fix-yes" class="btn btn--sm btn--primary">БАЛЕ</button>
          <button id="error-fix-no" class="btn btn--sm btn--ghost">НЕ</button>
        </div>
      </div>
      <div class="editor-tabs">
        <button id="editor-tab-code" class="editor-tab active">Код</button>
        <button id="editor-tab-run" class="editor-tab">Натиҷа (RUN)</button>
        <button id="editor-run-btn" class="btn btn--sm btn--accent">▶ RUN</button>
      </div>
      <div id="editor-container" class="editor-root"></div>
      <div id="run-panel" class="run-panel" hidden>
        <div id="run-container" class="run-frame-wrap"></div>
        <div id="console-container" class="console-panel"></div>
      </div>
    </section>

    <!-- ==================== AI KEYS ==================== -->
    <section id="view-ai-keys" class="view">
      <div class="view-toolbar">
        <h2>Калидҳои Зеҳни сунъӣ</h2>
        <button id="ak-add-btn" class="btn btn--primary btn--round">+</button>
      </div>
      <div id="ai-keys-list" class="ai-keys-list"></div>
    </section>

    <!-- ==================== PROJECT CHAT ==================== -->
    <section id="view-chat" class="view">
      <h2 id="chat-title" class="chat-header">Зеҳни сунъӣ</h2>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="Ба Зеҳни сунъӣ нависед..."></textarea>
        <button id="chat-send" class="btn btn--primary btn--round">➤</button>
      </div>
    </section>

    <!-- ==================== AL CHAT ==================== -->
    <section id="view-al-chat" class="view">
      <h2 class="chat-header">AL CHAT — Азиззода Валиҷон</h2>
      <div id="al-chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="al-chat-input" rows="1" placeholder="Паём нависед..."></textarea>
        <button id="al-chat-send" class="btn btn--primary btn--round">➤</button>
      </div>
    </section>

    <!-- ==================== SETTINGS ==================== -->
    <section id="view-settings" class="view"></section>

    <!-- ==================== APK BUILDER ==================== -->
    <section id="view-builder" class="view">
      <div class="view-toolbar"><h2>Табдил ба APK</h2></div>
      <div class="builder-body"></div>
    </section>

  </main>

  <div id="toast-container" class="toast-container"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/projects.js"></script>
<script src="js/files.js"></script>
<script src="js/syntax.js"></script>
<script src="js/editor.js"></script>
<script src="js/console.js"></script>
<script src="js/run.js"></script>
<script src="js/ai.js"></script>
<script src="js/ai-keys.js"></script>
<script src="js/chat.js"></script>
<script src="js/build-api.js"></script>
<script src="js/apk-builder.js"></script>
<script src="js/settings.js"></script>
<script src="js/import-export.js"></script>
<script src="app.js"></script>
</body>
</html>
