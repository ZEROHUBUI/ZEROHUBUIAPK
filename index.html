<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ZEROHUBUIAL — Web APK Builder</title>
<style>
/* ===== css/base.css ===== */
/* base.css — reset, тағйирёбандаҳо, скелети умумии саҳифа */

:root {
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --header-h: 58px;
  --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

[data-theme="dark"] {
  --bg-0: #070b18;
  --bg-1: #0c1226;
  --bg-2: #131c39;
  --glow-1: #2b3fff;
  --glow-2: #00d1ff;
  --text: #eaf0ff;
  --text-dim: #93a2c9;
  --glass-bg: rgba(30, 41, 78, 0.38);
  --glass-border: rgba(140, 170, 255, 0.28);
  --glass-border-strong: rgba(150, 190, 255, 0.5);
  --accent: #4f7dff;
  --accent-2: #33e0ff;
  --danger: #ff5c7a;
  --shadow: 0 8px 32px rgba(0, 0, 20, 0.45);
}

[data-theme="light"] {
  --bg-0: #dce6f7;
  --bg-1: #eaf1fb;
  --bg-2: #f4f8ff;
  --glow-1: #7fa8ff;
  --glow-2: #7fe0ff;
  --text: #131a2e;
  --text-dim: #4b587a;
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-border: rgba(20, 30, 60, 0.14);
  --glass-border-strong: rgba(20, 30, 60, 0.25);
  --accent: #3358e0;
  --accent-2: #0098c2;
  --danger: #d63158;
  --shadow: 0 8px 28px rgba(30, 50, 100, 0.16);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  overflow-x: hidden;
}
body {
  font-family: var(--font-main);
  color: var(--text);
  background:
    radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--glow-1) 30%, transparent), transparent 55%),
    radial-gradient(circle at 90% 20%, color-mix(in srgb, var(--glow-2) 22%, transparent), transparent 50%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
  background-attachment: fixed;
  min-height: 100dvh;
  transition: background 0.4s ease, color 0.3s ease;
}

button, input, textarea, select {
  font-family: inherit;
  color: inherit;
}

h1, h2, h3, p { margin: 0; }

#app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
}

#app-main {
  flex: 1;
  padding: 14px 14px calc(24px + env(safe-area-inset-bottom));
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  overflow-x: hidden;
}

.view { display: none; }
.view--active { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.view-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 0 14px;
}

.empty-hint {
  color: var(--text-dim);
  text-align: center;
  padding: 30px 10px;
}

.icon-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text);
  width: 40px; height: 40px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}
.icon-btn:hover, .icon-btn:active { background: rgba(140, 170, 255, 0.15); }

label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
label input, label select, label textarea {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-size: 15px;
}
[data-theme="light"] label input,
[data-theme="light"] label select,
[data-theme="light"] label textarea {
  background: rgba(20, 30, 60, 0.04);
}

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ===== css/glass.css ===== */
/* glass.css — компонентҳои Glassmorphism (шишаи шаффоф) */

.glass-panel {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
}

.glass-row {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* ---- Header ---- */
#app-header {
  position: sticky;
  top: env(safe-area-inset-top);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--header-h);
  padding: 0 10px;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  margin: 0 8px;
}
.app-header__title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 700;
}
#back-btn { display: inline-flex; }

/* ---- Side menu ---- */
#menu-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,10,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 60;
}
#menu-overlay.open { opacity: 1; pointer-events: auto; }

#side-menu {
  position: fixed;
  top: 0; bottom: 0; left: 0;
  width: min(78vw, 320px);
  transform: translateX(-105%);
  transition: transform 0.28s ease;
  z-index: 61;
  padding: calc(20px + env(safe-area-inset-top)) 14px 20px;
  border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#side-menu.open { transform: translateX(0); }

.side-menu__item {
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
  font-size: 15px;
  cursor: pointer;
}
.side-menu__item:hover, .side-menu__item:active {
  background: rgba(140, 170, 255, 0.14);
  border-color: var(--glass-border);
}

/* ---- Buttons ---- */
.btn {
  border: 1px solid var(--glass-border);
  background: rgba(140, 170, 255, 0.1);
  color: var(--text);
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}
.btn:active { transform: scale(0.97); }
.btn--primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none;
  color: #fff;
  font-weight: 600;
}
.btn--accent { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border: none; }
.btn--ghost { background: transparent; }
.btn--danger { background: rgba(255, 92, 122, 0.16); border-color: var(--danger); color: var(--danger); }
.btn--sm { padding: 8px 12px; font-size: 13px; }
.btn--block { width: 100%; margin-top: 10px; }
.btn--round { width: 42px; height: 42px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; }
.file-btn { text-align: center; cursor: pointer; }

.segmented { display: flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--glass-border); }
.seg-btn { border: none; background: transparent; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
.seg-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

.switch { position: relative; display: inline-block; width: 46px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch__track { position: absolute; inset: 0; background: rgba(140,170,255,0.2); border-radius: 999px; transition: 0.2s; border: 1px solid var(--glass-border); }
.switch__track::before { content: ''; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
.switch input:checked + .switch__track { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.switch input:checked + .switch__track::before { transform: translateX(20px); }

/* ---- Modal ---- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,15,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 200;
  padding: 0;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%;
  max-width: 440px;
  padding: 20px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  transform: translateY(30px);
  transition: transform 0.25s ease;
  max-height: 85dvh;
  overflow-y: auto;
}
.modal-overlay.show .modal { transform: translateY(0); }
@media (min-width: 560px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: var(--radius-lg); }
}
.modal__title { margin-bottom: 8px; font-size: 17px; }
.modal__msg { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }
.modal__input {
  width: 100%; padding: 11px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text);
  margin-bottom: 16px; font-size: 15px;
}
.modal__actions { display: flex; gap: 10px; justify-content: flex-end; }

.action-sheet__list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.action-sheet__item {
  text-align: left; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(140,170,255,0.08); cursor: pointer; font-size: 15px; color: var(--text);
}
.action-sheet__item.danger { color: var(--danger); border-color: rgba(255,92,122,0.4); }

/* ---- Toasts ---- */
.toast-container {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
  z-index: 300;
  padding: 0 14px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 999px;
  max-width: 480px; width: 100%;
  transform: translateY(20px); opacity: 0;
  transition: all 0.3s ease;
  font-size: 14px;
}
.toast--show { transform: translateY(0); opacity: 1; }
.toast--error { border-color: var(--danger); }
.toast--success { border-color: #38e29b; }

/* ---- Огоҳии муҳит (масалан IndexedDB дастнорас) ---- */
.env-warning {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 400;
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
}
.env-warning code {
  display: block; background: rgba(0,0,0,0.3); padding: 8px 10px;
  border-radius: 8px; margin: 6px 0; font-size: 13px;
}
.env-warning p { font-size: 13px; color: var(--text-dim); margin: 6px 0; }

/* ===== css/home.css ===== */
/* home.css — экрани intro ва экрани асосӣ */

#intro-screen {
  position: fixed; inset: 0; z-index: 500;
  background: radial-gradient(circle at 50% 30%, #16224a, #06070f 70%);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.4s ease;
}
#intro-screen.fade-out { opacity: 0; }
#intro-video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.intro-fallback {
  position: relative; z-index: 1;
  text-align: center; color: #eaf0ff;
}
.intro-fallback__logo {
  font-size: 28px; font-weight: 800; letter-spacing: 3px;
  background: linear-gradient(90deg, #4f7dff, #33e0ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: 8px;
  animation: pulseGlow 2.4s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(79,125,255,0.4)); }
  50% { filter: drop-shadow(0 0 18px rgba(51,224,255,0.6)); }
}
#intro-skip {
  position: absolute;
  bottom: calc(30px + env(safe-area-inset-bottom));
  right: 20px;
  z-index: 2;
  color: #fff;
  border-color: rgba(255,255,255,0.3);
}

/* ---- Home grid ---- */
.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}
.home-card {
  aspect-ratio: 1 / 0.9;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  cursor: pointer;
  border: none;
  transition: transform 0.18s ease;
}
.home-card:active { transform: scale(0.96); }
.home-card__icon { font-size: 34px; }
.home-card__label {
  font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
  text-align: center; color: var(--text);
}

/* ===== css/projects.css ===== */
/* projects.css — рӯйхати лоиҳаҳо ва дарахти файлҳо */

.projects-list { display: flex; flex-direction: column; gap: 10px; }
.project-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer;
}
.project-card__main { flex: 1; }
.project-card__main h3 { font-size: 15px; margin-bottom: 4px; }
.project-card__main p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.project-card__date { opacity: 0.8; }

.breadcrumb {
  font-size: 13px; color: var(--text-dim);
  margin-bottom: 10px; overflow-x: auto; white-space: nowrap;
}
.crumb { cursor: pointer; }
.crumb:hover { color: var(--accent-2); }
.crumb-sep { margin: 0 6px; }

.project-toolbar {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 10px; margin-bottom: 10px;
}
.project-toolbar .btn { white-space: nowrap; flex-shrink: 0; }

.project-tree { display: flex; flex-direction: column; gap: 8px; }
.tree-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 12px;
}
.tree-row__icon { font-size: 18px; }
.tree-row__name { flex: 1; cursor: pointer; font-size: 14.5px; }

.ai-keys-list { display: flex; flex-direction: column; gap: 10px; }
.key-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 10px; }
.key-row__main { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.key-row__main strong { font-size: 14.5px; }
.key-row__meta { font-size: 12px; color: var(--text-dim); }
.key-row__actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

/* ===== css/editor.css ===== */
/* editor.css — муҳаррири код, RUN, консол */

.editor-tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.editor-tab {
  background: transparent; border: 1px solid var(--glass-border);
  color: var(--text-dim); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
}
.editor-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; }
.editor-tabs .btn { margin-left: auto; }

.error-banner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 12px 14px; margin-bottom: 10px;
  border-color: var(--danger);
}
#error-banner-text { font-size: 13px; flex: 1; }
.error-banner__actions { display: flex; gap: 6px; flex-shrink: 0; }

.editor-root {
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: rgba(5, 8, 20, 0.35);
  display: flex; flex-direction: column;
  height: calc(100dvh - var(--header-h) - 190px);
  min-height: 280px;
}
[data-theme="light"] .editor-root { background: rgba(255,255,255,0.5); }

.editor-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-bottom: 1px solid var(--glass-border);
  font-size: 13px; color: var(--text-dim);
}
.editor-filename { font-family: monospace; }
.editor-toolbar__actions { display: flex; gap: 2px; }
.editor-toolbar__actions .icon-btn { width: 32px; height: 32px; font-size: 15px; }

.editor-search-bar {
  display: flex; gap: 6px; padding: 8px 10px;
  border-bottom: 1px solid var(--glass-border);
  flex-wrap: wrap;
}
.editor-search-bar input {
  flex: 1; min-width: 90px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--glass-border); background: rgba(255,255,255,0.06); color: var(--text); font-size: 13px;
}

.editor-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

.editor-gutter {
  flex-shrink: 0;
  width: 42px;
  overflow: hidden;
  text-align: right;
  padding: 10px 6px 10px 0;
  font-family: 'Consolas', 'Menlo', monospace;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-dim);
  user-select: none;
  border-right: 1px solid var(--glass-border);
  background: rgba(0,0,0,0.1);
}
.gutter-line { box-sizing: border-box; }

.editor-surface {
  position: relative;
  flex: 1;
  overflow: hidden;
  min-width: 0;
}
.editor-highlight, .editor-textarea {
  margin: 0;
  padding: 10px 12px;
  font-family: 'Consolas', 'Menlo', monospace;
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.editor-highlight {
  position: absolute; inset: 0;
  overflow: auto;
  pointer-events: none;
  color: var(--text);
}
.editor-highlight code { display: block; }
.hl-line { min-height: 1em; }

.editor-textarea {
  position: relative;
  width: 100%; height: 100%;
  border: none; resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--accent-2);
  overflow: auto;
  z-index: 1;
}
.editor-textarea::selection { background: rgba(79,125,255,0.35); }

.tok-comment { color: #7d89ad; font-style: italic; }
.tok-string { color: #8fe08c; }
.tok-keyword { color: #7aa2ff; font-weight: 600; }
.tok-number { color: #ffb86c; }
.tok-func { color: #6fe3ff; }
.tok-tag { color: #ff8fb8; }
.tok-attr { color: #ffd479; }
.tok-punct { color: var(--text-dim); }
.tok-selector { color: #ffb86c; }
.tok-property { color: #7aa2ff; }
.tok-prop { color: #ff8fb8; }

.run-panel { display: flex; flex-direction: column; gap: 10px; height: calc(100dvh - var(--header-h) - 150px); }
.run-frame-wrap {
  flex: 1.4; min-height: 160px;
  border: 1px solid var(--glass-border); border-radius: var(--radius-md);
  overflow: hidden; background: #fff;
}
.run-frame { width: 100%; height: 100%; border: none; }

.console-panel {
  flex: 1; min-height: 120px;
  border: 1px solid var(--glass-border); border-radius: var(--radius-md);
  background: rgba(0,0,0,0.25);
  display: flex; flex-direction: column; overflow: hidden;
}
.console-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; font-size: 12px; color: var(--text-dim);
  border-bottom: 1px solid var(--glass-border);
}
.console-body {
  flex: 1; overflow-y: auto; padding: 6px 10px;
  font-family: monospace; font-size: 12.5px;
}
.console-line { display: flex; gap: 6px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.console-line--error { color: #ff7a90; }
.console-line--warn { color: #ffcf6b; }
.console-line--info { color: #6fe3ff; }
.console-line__text { word-break: break-word; }

/* ===== css/chat.css ===== */
/* chat.css — чати Зеҳни сунъӣ ва AL CHAT */

.chat-header { padding: 6px 2px 14px; font-size: 16px; }

.chat-messages {
  display: flex; flex-direction: column; gap: 10px;
  height: calc(100dvh - var(--header-h) - 165px);
  overflow-y: auto;
  padding: 4px 2px 10px;
}
.chat-msg { display: flex; }
.chat-msg--user { justify-content: flex-end; }
.chat-msg--assistant { justify-content: flex-start; }
.chat-msg__bubble {
  max-width: 82%;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  font-size: 14px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
}
.chat-msg--user .chat-msg__bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none;
}

.chat-input-row {
  display: flex; align-items: flex-end; gap: 8px;
  position: sticky; bottom: calc(8px + env(safe-area-inset-bottom));
}
.chat-input-row textarea {
  flex: 1; resize: none; max-height: 120px;
  padding: 12px 14px; border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);

// ===== js/utils.js ===== //
// utils.js — ёридиҳандаҳои умумӣ
'use strict';

const Utils = {
  uid(prefix = 'id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
  },

  escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },

  debounce(fn, wait = 300) {
    let t = null;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  },

  formatBytes(bytes) {
    if (!bytes && bytes !== 0) return '—';
    if (bytes === 0) return '0 Б';
    const units = ['Б', 'КБ', 'МБ', 'ГБ'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
  },

  formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('tg-TJ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  },

  downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  },

  fileExtension(name) {
    const parts = String(name).split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '';
  },

  iconForNode(type, name) {
    if (type === 'folder') return '📁';
    const ext = Utils.fileExtension(name);
    const map = {
      html: '🌐', htm: '🌐', css: '🎨', js: '⚙️', json: '🧩',
      xml: '📰', md: '📝', txt: '📄', png: '🖼️', jpg: '🖼️',
      jpeg: '🖼️', gif: '🖼️', svg: '🖼️', mp4: '🎬'
    };
    return map[ext] || '📄';
  },

  isTextFile(name) {
    const ext = Utils.fileExtension(name);
    return ['html', 'htm', 'css', 'js', 'json', 'xml', 'md', 'txt', 'svg'].includes(ext);
  },

  clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  },

  readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  },

  readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }
};

window.Utils = Utils;

// ===== js/notifications.js ===== //
// notifications.js — системаи огоҳиномаҳо (toast)
'use strict';

const Notify = {
  container: null,

  init() {
    this.container = document.getElementById('toast-container');
  },

  show(message, type = 'info', duration = 3500) {
    if (!this.container) this.init();
    if (!this.container) return;
    const el = document.createElement('div');
    el.className = `toast toast--${type} glass-panel`;
    const icons = { info: 'ℹ️', success: '✅', error: '⛔', warn: '⚠️' };
    el.innerHTML = `<span class="toast__icon">${icons[type] || icons.info}</span><span class="toast__msg"></span>`;
    el.querySelector('.toast__msg').textContent = message;
    this.container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('toast--show'));
    setTimeout(() => {
      el.classList.remove('toast--show');
      setTimeout(() => el.remove(), 300);
    }, duration);
  },

  success(msg) { this.show(msg, 'success'); },
  error(msg) { this.show(msg, 'error', 5000); },
  warn(msg) { this.show(msg, 'warn', 4500); },
  info(msg) { this.show(msg, 'info'); },

  // Диалоги тасдиқ — иваз мекунад window.confirm бо намуди шишагӣ
  confirmDialog(title, message, confirmLabel = 'ҚАБУЛ', cancelLabel = 'БЕКОР') {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal glass-panel">
          <h3 class="modal__title"></h3>
          <p class="modal__msg"></p>
          <div class="modal__actions">
            <button class="btn btn--ghost" data-act="cancel"></button>
            <button class="btn btn--primary" data-act="confirm"></button>
          </div>
        </div>`;
      overlay.querySelector('.modal__title').textContent = title;
      overlay.querySelector('.modal__msg').textContent = message;
      overlay.querySelector('[data-act="cancel"]').textContent = cancelLabel;
      overlay.querySelector('[data-act="confirm"]').textContent = confirmLabel;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const close = (val) => {
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 200);
        resolve(val);
      };
      overlay.querySelector('[data-act="cancel"]').onclick = () => close(false);
      overlay.querySelector('[data-act="confirm"]').onclick = () => close(true);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    });
  },

  // Диалоги вуруди матн — иваз мекунад window.prompt
  promptDialog(title, defaultValue = '') {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal glass-panel">
          <h3 class="modal__title"></h3>
          <input type="text" class="modal__input" />
          <div class="modal__actions">
            <button class="btn btn--ghost" data-act="cancel">БЕКОР</button>
            <button class="btn btn--primary" data-act="confirm">ҚАБУЛ</button>
          </div>
        </div>`;
      overlay.querySelector('.modal__title').textContent = title;
      const input = overlay.querySelector('.modal__input');
      input.value = defaultValue;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => { overlay.classList.add('show'); input.focus(); input.select(); });
      const close = (val) => {
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 200);
        resolve(val);
      };
      overlay.querySelector('[data-act="cancel"]').onclick = () => close(null);
      overlay.querySelector('[data-act="confirm"]').onclick = () => close(input.value.trim());
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') close(input.value.trim());
        if (e.key === 'Escape') close(null);
      });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
    });
  }
};

window.Notify = Notify;

// ===== js/storage.js ===== //
// storage.js — қабати воқеии нигоҳдории маълумот (IndexedDB барои маълумоти калон,
// localStorage барои танзимоти хурд). Ҳеҷ маълумот ба сервер фиристода намешавад.
'use strict';

const DB_NAME = 'zerohubuial_db';
const DB_VERSION = 1;

const STORES = {
  PROJECTS: 'projects',
  NODES: 'nodes',       // файлҳо ва папкаҳо
  CHATS: 'chats',       // таърихи чат (ҳам AI дохили лоиҳа, ҳам AL CHAT)
  AI_KEYS: 'ai_keys',
  BUILDS: 'builds'      // таърихи сохтмонҳои APK
};

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORES.PROJECTS)) {
        db.createObjectStore(STORES.PROJECTS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORES.NODES)) {
        const nodeStore = db.createObjectStore(STORES.NODES, { keyPath: 'id' });
        nodeStore.createIndex('byProject', 'projectId', { unique: false });
        nodeStore.createIndex('byParent', 'parentId', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.CHATS)) {
        const chatStore = db.createObjectStore(STORES.CHATS, { keyPath: 'id' });
        chatStore.createIndex('byScope', 'scope', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.AI_KEYS)) {
        db.createObjectStore(STORES.AI_KEYS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORES.BUILDS)) {
        const buildStore = db.createObjectStore(STORES.BUILDS, { keyPath: 'id' });
        buildStore.createIndex('byProject', 'projectId', { unique: false });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}

function tx(storeName, mode = 'readonly') {
  return openDB().then((db) => db.transaction(storeName, mode).objectStore(storeName));
}

const DB = {
  STORES,

  async put(storeName, value) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = store.put(value);
      r.onsuccess = () => resolve(value);
      r.onerror = () => reject(r.error);
    });
  },

  async get(storeName, id) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const r = store.get(id);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    });
  },

  async delete(storeName, id) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = store.delete(id);
      r.onsuccess = () => resolve(true);
      r.onerror = () => reject(r.error);
    });
  },

  async getAll(storeName) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const r = store.getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  },

  async getAllByIndex(storeName, indexName, value) {
    const store = await tx(storeName);
    return new Promise((resolve, reject) => {
      const idx = store.index(indexName);
      const r = idx.getAll(value);
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  },

  async clearStore(storeName) {
    const store = await tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = store.clear();
      r.onsuccess = () => resolve(true);
      r.onerror = () => reject(r.error);
    });
  },

  async clearAll() {
    for (const s of Object.values(STORES)) {
      await this.clearStore(s);
    }
  }
};

// ---- localStorage барои танзимоти хурд ----
const LS_PREFIX = 'zh_';
const Settings = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    } catch (e) {
      console.error('Хатои нигоҳдории localStorage:', e);
    }
  },
  remove(key) {
    localStorage.removeItem(LS_PREFIX + key);
  },
  clearAll() {
    Object.keys(localStorage)
      .filter((k) => k.startsWith(LS_PREFIX))
      .forEach((k) => localStorage.removeItem(k));
  }
};

window.DB = DB;
window.Settings = Settings;

// ===== js/router.js ===== //
// router.js — роутери сабуки мабтанӣ бар hash
'use strict';

const Router = {
  routes: {},
  _current: null,

  on(pattern, handler) {
    this.routes[pattern] = handler;
    return this;
  },

  start() {
    window.addEventListener('hashchange', () => this._resolve());
    this._resolve();
  },

  go(hash) {
    if (location.hash === hash) { this._resolve(); return; }
    location.hash = hash;
  },

  back() {
    history.back();
  },

  _resolve() {
    const hash = location.hash || '#/home';
    const [path, query] = hash.slice(1).split('?');
    const parts = path.split('/').filter(Boolean);
    const params = {};
    if (query) {
      new URLSearchParams(query).forEach((v, k) => { params[k] = v; });
    }

    for (const pattern of Object.keys(this.routes)) {
      const pParts = pattern.split('/').filter(Boolean);
      if (pParts.length !== parts.length) continue;
      let match = true;
      const routeParams = { ...params };
      for (let i = 0; i < pParts.length; i++) {
        if (pParts[i].startsWith(':')) {
          routeParams[pParts[i].slice(1)] = decodeURIComponent(parts[i]);
        } else if (pParts[i] !== parts[i]) {
          match = false; break;
        }
      }
      if (match) {
        this._current = pattern;
        this.routes[pattern](routeParams);
        return;
      }
    }
    // роҳи ёфтнашуда — бозгашт ба хона
    if (hash !== '#/home') this.go('#/home');
  }
};

window.Router = Router;

// projects.js — идоракунии воқеии лоиҳаҳо (IndexedDB)

  },

  },

  async create(name) {

    const project = {
      id: Utils.uid('proj'),
      name: name || 'Лоиҳаи беном',

      updatedAt: now
    };

    // Файлҳои ибтидоии лоиҳа — воқеан сохта мешаванд, на тахминӣ
    const indexHtml = {
      id: Utils.uid('node'),
      projectId: project.id,
      parentId: null,
      type: 'file',
      name: 'index.html',
      content: `<!DOCTYPE html>\n<html lang="tj">\n<head>\n  <meta charset="UTF-8">\n  <title>${Utils.escapeHtml(project.name)}</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Салом аз ${Utils.escapeHtml(project.name)}!</h1>\n  <script src="script.js"><\/script>\n</body>\n</html>\n`,
      createdAt: now,
      updatedAt: now
    };
    const styleCss = {
      id: Utils.uid('node'),
      projectId: project.id,
      parentId: null,
      type: 'file',
      name: 'style.css',
      content: `body {\n  font-family: sans-serif;\n  background: #0f172a;\n  color: #e2e8f0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  height: 100vh;\n  margin: 0;\n}\n`,
      createdAt: now,
      updatedAt: now
    };
    const scriptJs = {
      id: Utils.uid('node'),
      projectId: project.id,
      parentId: null,
      type: 'file',
      name: 'script.js',
      content: `console.log('Лоиҳа "${project.name}" иҷро шуд.');\n`,
      createdAt: now,
      updatedAt: now
    };
    await DB.put(DB.STORES.NODES, indexHtml);
    await DB.put(DB.STORES.NODES, styleCss);
    await DB.put(DB.STORES.NODES, scriptJs);

    return project;
  },

  async rename(id, newName) {
    const project = await this.get(id);
    if (!project) throw new Error('Лоиҳа ёфт нашуд.');
    project.name = newName;
    project.updatedAt = Date.now();
    await DB.put(DB.STORES.PROJECTS, project);
    return project;
  },

  async touch(id) {
    const project = await this.get(id);
    if (!project) return;
    project.updatedAt = Date.now();
    await DB.put(DB.STORES.PROJECTS, project);
  },

  async remove(id) {
    const nodes = await DB.getAllByIndex(DB.STORES.NODES, 'byProject', id);
    for (const n of nodes) await DB.delete(DB.STORES.NODES, n.id);
    const chats = await DB.getAllByIndex(DB.STORES.CHATS, 'byScope', id);
    for (const c of chats) await DB.delete(DB.STORES.CHATS, c.id);
    await DB.delete(DB.STORES.PROJECTS, id);
  },

  async stats(id) {
    const nodes = await DB.getAllByIndex(DB.STORES.NODES, 'byProject', id);
    const files = nodes.filter((n) => n.type === 'file');
    const folders = nodes.filter((n) => n.type === 'folder');
    const size = files.reduce((sum, f) => sum + (f.content ? new Blob([f.content]).size : (f.size || 0)), 0);
    return { fileCount: files.length, folderCount: folders.length, size };
  }
};

// ===== js/files.js ===== //
// files.js — идоракунии воқеии файлҳо ва папкаҳо дар дохили лоиҳа
'use strict';

const Files = {
  async children(projectId, parentId = null) {
    const all = await DB.getAllByIndex(DB.STORES.NODES, 'byProject', projectId);
    const kids = all.filter((n) => (n.parentId || null) === (parentId || null));
    // ПАПКАҲО АВВАЛ, ФАЙЛҲО БАЪД
    kids.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return a.name.localeCompare(b.name, 'tg');
    });
    return kids;
  },

  async allInProject(projectId) {
    return DB.getAllByIndex(DB.STORES.NODES, 'byProject', projectId);
  },

  async get(nodeId) {
    return DB.get(DB.STORES.NODES, nodeId);
  },

  async siblingNameExists(projectId, parentId, name, excludeId = null) {
    const kids = await this.children(projectId, parentId);
    return kids.some((k) => k.name.toLowerCase() === name.toLowerCase() && k.id !== excludeId);
  },

  async createFolder(projectId, parentId, name) {
    if (await this.siblingNameExists(projectId, parentId, name)) {
      throw new Error(`Папкаи бо номи "${name}" аллакай вуҷуд дорад.`);
    }
    const now = Date.now();
    const node = {
      id: Utils.uid('node'), projectId, parentId: parentId || null,
      type: 'folder', name, createdAt: now, updatedAt: now
    };
    await DB.put(DB.STORES.NODES, node);
    await Projects.touch(projectId);
    return node;
  },

  async createFile(projectId, parentId, name, content = '') {
    if (await this.siblingNameExists(projectId, parentId, name)) {
      throw new Error(`Файли бо номи "${name}" аллакай вуҷуд дорад.`);
    }
    const now = Date.now();
    const node = {
      id: Utils.uid('node'), projectId, parentId: parentId || null,
      type: 'file', name, content, createdAt: now, updatedAt: now
    };
    await DB.put(DB.STORES.NODES, node);
    await Projects.touch(projectId);
    return node;
  },

  async rename(nodeId, newName) {
    const node = await this.get(nodeId);
    if (!node) throw new Error('Ин файл/папка ёфт нашуд.');
    if (await this.siblingNameExists(node.projectId, node.parentId, newName, nodeId)) {
      throw new Error(`Номи "${newName}" аллакай истифода шудааст.`);
    }
    node.name = newName;
    node.updatedAt = Date.now();
    await DB.put(DB.STORES.NODES, node);
    await Projects.touch(node.projectId);
    return node;
  },

  async updateContent(nodeId, content) {
    const node = await this.get(nodeId);
    if (!node) throw new Error('Файл ёфт нашуд.');
    node.content = content;
    node.updatedAt = Date.now();
    await DB.put(DB.STORES.NODES, node);
    await Projects.touch(node.projectId);
    return node;
  },

  async delete(nodeId) {
    const node = await this.get(nodeId);
    if (!node) return;
    if (node.type === 'folder') {
      const kids = await this.children(node.projectId, node.id);
      for (const k of kids) await this.delete(k.id);
    }
    await DB.delete(DB.STORES.NODES, nodeId);
    await Projects.touch(node.projectId);
  },

  async move(nodeId, newParentId) {
    const node = await this.get(nodeId);
    if (!node) throw new Error('Ёфт нашуд.');
    // пешгирии ҷойивазкунии папка ба зерпапкаи худаш
    if (node.type === 'folder') {
      let cursor = newParentId;
      while (cursor) {
        if (cursor === node.id) throw new Error('Папкаро ба дохили худаш гузарондан мумкин нест.');
        const p = await this.get(cursor);
        cursor = p ? p.parentId : null;
      }
    }
    if (await this.siblingNameExists(node.projectId, newParentId, node.name, nodeId)) {
      throw new Error('Дар мақсад файл/папкаи ҳамин ном аллакай ҳаст.');
    }
    node.parentId = newParentId || null;
    node.updatedAt = Date.now();
    await DB.put(DB.STORES.NODES, node);
    return node;
  },

  async duplicate(nodeId) {
    const node = await this.get(nodeId);
    if (!node) throw new Error('Ёфт нашуд.');
    const copyName = this._copyName(node.name);
    if (node.type === 'file') {
      return this.createFile(node.projectId, node.parentId, copyName, node.content);
    }
    const folder = await this.createFolder(node.projectId, node.parentId, copyName);
    const kids = await this.children(node.projectId, node.id);
    for (const k of kids) await this._duplicateInto(k, folder.id);
    return folder;
  },

  async _duplicateInto(node, newParentId) {
    if (node.type === 'file') {
      return this.createFile(node.projectId, newParentId, node.name, node.content);
    }
    const folder = await this.createFolder(node.projectId, newParentId, node.name);
    const kids = await this.children(node.projectId, node.id);
    for (const k of kids) await this._duplicateInto(k, folder.id);
    return folder;
  },

  _copyName(name) {
    const dot = name.lastIndexOf('.');
    if (dot > 0) return `${name.slice(0, dot)} (нусха)${name.slice(dot)}`;
    return `${name} (нусха)`;
  },

  async pathOf(nodeId) {
    const parts = [];
    let cursor = await this.get(nodeId);
    while (cursor) {
      parts.unshift(cursor.name);
      cursor = cursor.parentId ? await this.get(cursor.parentId) : null;
    }
    return parts.join('/');
  }
};

window.Files = Files;

// ===== js/syntax.js ===== //
// syntax.js — равшанкунии соддаи синтаксис (сатр ба сатр).
// Маҳдудият: назардошти воқеӣ, аммо коментҳои бисёрсатра пурра пайгирӣ намешаванд —
// ин маҳдудияти воқеии як highlighter-и сабук аст, на хатои пинҳонӣ.
'use strict';

const Syntax = {
  langFor(filename) {
    const ext = Utils.fileExtension(filename);
    const map = {
      html: 'html', htm: 'html', css: 'css', js: 'javascript',
      json: 'json', xml: 'xml', md: 'markdown'
    };
    return map[ext] || 'plain';
  },

  highlightLine(text, lang) {
    if (text === '') return '';
    switch (lang) {
      case 'javascript': return this._js(text);
      case 'css': return this._css(text);
      case 'html': case 'xml': return this._html(text);
      case 'json': return this._json(text);
      default: return Utils.escapeHtml(text);
    }
  },

  _wrap(cls, val) {
    return `<span class="tok-${cls}">${Utils.escapeHtml(val)}</span>`;
  },

  _js(text) {
    const rules = [
      { cls: 'comment', re: /\/\/.*$/ },
      { cls: 'string', re: /`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/ },
      { cls: 'keyword', re: /\b(const|let|var|function|return|if|else|for|while|do|break|continue|switch|case|default|class|extends|new|this|typeof|instanceof|try|catch|finally|throw|async|await|import|export|from|of|in|null|undefined|true|false|static|get|set|yield|delete|void)\b/ },
      { cls: 'number', re: /\b\d+(\.\d+)?\b/ },
      { cls: 'func', re: /\b[a-zA-Z_$][\w$]*(?=\s*\()/ }
    ];
    return this._apply(text, rules);
  },

  _css(text) {
    const rules = [
      { cls: 'comment', re: /\/\*.*?\*\// },
      { cls: 'string', re: /"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/ },
      { cls: 'selector', re: /^[.#]?[\w-]+(?=\s*\{)/ },
      { cls: 'property', re: /[\w-]+(?=\s*:)/ },
      { cls: 'number', re: /\b\d+(\.\d+)?(px|em|rem|%|vh|vw|s|ms)?\b/ }
    ];
    return this._apply(text, rules);
  },

  _html(text) {
    const rules = [
      { cls: 'comment', re: /<!--.*?-->/ },
      { cls: 'string', re: /"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/ },
      { cls: 'tag', re: /<\/?[a-zA-Z][\w-]*/ },
      { cls: 'attr', re: /\b[a-zA-Z-]+(?==)/ },
      { cls: 'punct', re: /\/?>/ }
    ];
    return this._apply(text, rules);
  },

  _json(text) {
    const rules = [
      { cls: 'prop', re: /"(?:\\.|[^"\\])*"(?=\s*:)/ },
      { cls: 'string', re: /"(?:\\.|[^"\\])*"/ },
      { cls: 'keyword', re: /\b(true|false|null)\b/ },
      { cls: 'number', re: /-?\b\d+(\.\d+)?\b/ }
    ];
    return this._apply(text, rules);
  },

  // Якҷоякунии қоидаҳо: пайдо кардани якумин ҷойгиршавии ҳар қоида дар матни боқимонда
  _apply(text, rules) {
    let out = '';
    let i = 0;
    while (i < text.length) {
      let best = null;
      for (const rule of rules) {
        const re = new RegExp(rule.re.source, rule.re.flags.includes('g') ? rule.re.flags : rule.re.flags + '');
        re.lastIndex = 0;
        const slice = text.slice(i);
        const m = slice.match(rule.re);
        if (m && m.index !== undefined) {
          if (!best || m.index < best.index) {
            best = { index: m.index, text: m[0], cls: rule.cls };
          }
        }
      }
      if (!best) {
        out += Utils.escapeHtml(text.slice(i));
        break;
      }
      if (best.index > 0) out += Utils.escapeHtml(text.slice(i, i + best.index));
      out += this._wrap(best.cls, best.text);
      i += best.index + best.text.length;
      if (best.text.length === 0) i++; // пешгирии давраи беохир
    }
    return out;
  }
};

window.Syntax = Syntax;

// ===== js/editor.js ===== //
// editor.js — муҳаррири воқеии код: рақами сатр (танҳо барои сатри воқеӣ, на барои
// хатти визуалии печондашуда), равшанкунии синтаксис, ҷустуҷӯ/ивазкунӣ, нигоҳдории автоматӣ.
'use strict';

const Editor = {
  root: null,
  gutterEl: null,
  highlightEl: null,
  textareaEl: null,
  currentNode: null,
  lang: 'plain',
  autosaveTimer: null,
  undoStack: [],
  redoStack: [],
  _lastSavedValue: '',

  mount(rootEl) {
    this.root = rootEl;
    this.root.innerHTML = `
      <div class="editor-toolbar">
        <span class="editor-filename" id="editor-filename">—</span>
        <div class="editor-toolbar__actions">
          <button class="icon-btn" id="editor-search-btn" title="Ҷустуҷӯ">🔍</button>
          <button class="icon-btn" id="editor-undo-btn" title="Бекор кардан">↩️</button>
          <button class="icon-btn" id="editor-redo-btn" title="Баргардондан">↪️</button>
        </div>
      </div>
      <div class="editor-search-bar" id="editor-search-bar" hidden>
        <input type="text" id="editor-search-input" placeholder="Ҷустуҷӯ...">
        <input type="text" id="editor-replace-input" placeholder="Иваз бо...">
        <button class="btn btn--xs" id="editor-replace-one">Иваз</button>
        <button class="btn btn--xs" id="editor-replace-all">Ҳама</button>
        <button class="icon-btn" id="editor-search-close">✕</button>
      </div>
      <div class="editor-wrap">
        <div class="editor-gutter" id="editor-gutter"></div>
        <div class="editor-surface">
          <pre class="editor-highlight" id="editor-highlight" aria-hidden="true"><code></code></pre>
          <textarea class="editor-textarea" id="editor-textarea" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
      </div>`;

    this.gutterEl = this.root.querySelector('#editor-gutter');
    this.highlightEl = this.root.querySelector('#editor-highlight code');
    this.textareaEl = this.root.querySelector('#editor-textarea');

    this.textareaEl.addEventListener('input', () => this._onInput());
    this.textareaEl.addEventListener('scroll', () => this._syncScroll());
    this.textareaEl.addEventListener('keydown', (e) => this._onKeydown(e));
    window.addEventListener('resize', Utils.debounce(() => this._render(), 150));

    this.root.querySelector('#editor-search-btn').onclick = () => this._toggleSearch();
    this.root.querySelector('#editor-search-close').onclick = () => this._toggleSearch(false);
    this.root.querySelector('#editor-undo-btn').onclick = () => this.undo();
    this.root.querySelector('#editor-redo-btn').onclick = () => this.redo();
    this.root.querySelector('#editor-search-input').addEventListener('input', () => this._doSearch());
    this.root.querySelector('#editor-replace-one').onclick = () => this._replace(false);
    this.root.querySelector('#editor-replace-all').onclick = () => this._replace(true);
  },

  async open(node) {
    this.currentNode = node;
    this.lang = Syntax.langFor(node.name);
    this.textareaEl.value = node.content || '';
    this._lastSavedValue = this.textareaEl.value;
    this.undoStack = [this.textareaEl.value];
    this.redoStack = [];
    this.root.querySelector('#editor-filename').textContent = node.name;
    this._render();
  },

  getValue() {
    return this.textareaEl ? this.textareaEl.value : '';
  },

  _onInput() {
    this._render();
    this._pushUndo();
    clearTimeout(this.autosaveTimer);
    this.autosaveTimer = setTimeout(() => this._autosave(), 600);
  },

  _pushUndo: (function () {
    let t = null;
    return function () {
      clearTimeout(t);
      t = setTimeout(() => {
        const v = this.textareaEl.value;
        if (this.undoStack[this.undoStack.length - 1] !== v) {
          this.undoStack.push(v);
          if (this.undoStack.length > 200) this.undoStack.shift();
          this.redoStack = [];
        }
      }, 400);
    };
  })(),

  undo() {
    if (this.undoStack.length <= 1) return;
    this.redoStack.push(this.undoStack.pop());
    const v = this.undoStack[this.undoStack.length - 1];
    this.textareaEl.value = v;
    this._render();
    this._autosave();
  },

  redo() {
    if (!this.redoStack.length) return;
    const v = this.redoStack.pop();
    this.undoStack.push(v);
    this.textareaEl.value = v;
    this._render();
    this._autosave();
  },

  async _autosave() {
    if (!this.currentNode) return;
    const val = this.textareaEl.value;
    if (val === this._lastSavedValue) return;
    try {
      await Files.updateContent(this.currentNode.id, val);
      this._lastSavedValue = val;
      this.currentNode.content = val;
      document.dispatchEvent(new CustomEvent('zh:file-saved', { detail: { node: this.currentNode } }));
    } catch (e) {
      Notify.error('Хатои нигоҳдорӣ: ' + e.message);
    }
  },

  async forceSave() {
    clearTimeout(this.autosaveTimer);
    await this._autosave();
  },

  _onKeydown(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = this.textareaEl;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 2;
      this._onInput();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.undo(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); this.redo(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); this._toggleSearch(true); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); this.forceSave(); Notify.success('Захира шуд.'); }
  },

  _render() {
    const text = this.textareaEl.value;
    const lines = text.split('\n');

    // Равшанкунии синтаксис — ҳар сатри воқеӣ ҳамчун як <div> (ки метавонад
    // визуалӣ печонда шавад, аммо як сатри воқеӣ мемонад)
    this.highlightEl.innerHTML = lines
      .map((line) => `<div class="hl-line">${Syntax.highlightLine(line, this.lang) || '&nbsp;'}</div>`)
      .join('');

    // Гутер: рақами сатр — баландии ҳар ҳуҷра баробар ба баландии сатри воқеии
    // печондашуда карда мешавад, то рақами нав барои хатти визуалӣ сохта нашавад.
    const lineEls = this.highlightEl.querySelectorAll('.hl-line');
    let gutterHtml = '';
    lineEls.forEach((el, idx) => {
      const h = el.getBoundingClientRect().height || el.offsetHeight;
      gutterHtml += `<div class="gutter-line" style="height:${h}px">${idx + 1}</div>`;
    });
    this.gutterEl.innerHTML = gutterHtml;
    this._syncScroll();
  },

  _syncScroll() {
    const top = this.textareaEl.scrollTop;
    const left = this.textareaEl.scrollLeft;
    this.highlightEl.parentElement.scrollTop = top;
    this.highlightEl.parentElement.scrollLeft = left;
    this.gutterEl.scrollTop = top;
  },

  _toggleSearch(force) {
    const bar = this.root.querySelector('#editor-search-bar');
    const show = force !== undefined ? force : bar.hidden;
    bar.hidden = !show;
    if (show) this.root.querySelector('#editor-search-input').focus();
  },

  _doSearch() {
    const q = this.root.querySelector('#editor-search-input').value;
    if (!q) return;
    const idx = this.textareaEl.value.indexOf(q, this.textareaEl.selectionEnd || 0);
    const foundIdx = idx === -1 ? this.textareaEl.value.indexOf(q) : idx;
    if (foundIdx !== -1) {
      this.textareaEl.focus();
      this.textareaEl.setSelectionRange(foundIdx, foundIdx + q.length);
    }
  },

  _replace(all) {
    const q = this.root.querySelector('#editor-search-input').value;
    const rep = this.root.querySelector('#editor-replace-input').value;
    if (!q) return;
    if (all) {
      this.textareaEl.value = this.textareaEl.value.split(q).join(rep);
    } else {
      const start = this.textareaEl.selectionStart, end = this.textareaEl.selectionEnd;
      const sel = this.textareaEl.value.slice(start, end);
      if (sel === q) {
        this.textareaEl.value = this.textareaEl.value.slice(0, start) + rep + this.textareaEl.value.slice(end);
      } else {
        this._doSearch();
      }
    }
    this._onInput();
  }
};
